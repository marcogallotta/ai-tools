[pytest]
markers =
    smoke: add an individual test outside the curated smoke files
    full_suite_only: exclude a specialized or expensive test from a curated smoke file
    real_database_bootstrap: exercise migrations from a truly empty SQLite database
    boundary: exercise an external process, launcher, or real git command boundary
    invariant_request_replay: authoritative same-request replay without duplicate effects
    invariant_lease_authority: one live lease authority and exact lease handoff/recovery
    invariant_transaction_rollback: transaction ownership commits or rolls back as one unit
    invariant_partial_effect_recovery: partial effects are detected and reconciled without blind retry
    invariant_submission_terminal_proof: terminal submission state and proof remain atomic
    invariant_authorization: governed authorization is atomic, audited, and single-use
    invariant_planning_intent: Planning start requires the durable two-call intent gate
    invariant_abandonment: active abandonment fences and transfers forward authority exactly once
    invariant_database_bootstrap: empty-database initialization and migration use the real path
    invariant_backup_restore: backup and restore preserve durable database authority
    invariant_workflow_action_authority: unsafe snapshot facts suppress every ordinary workflow action
    database_boundary: include in the real SQLite bootstrap/migration/durability lane
    database_boundary_bootstrap: create the current schema from a truly empty database
    database_boundary_upgrade: migrate a historical schema through the real migration path
    database_boundary_concurrency: exercise real SQLite writer/initializer concurrency
    database_boundary_durability: exercise backup/restore with production SQLite pragmas
    production_sqlite_pragmas: do not replace SQLite synchronous settings in the test fixture
    producer_equivalence: proves a synthetic workflow-state builder matches a real producer route
    flake_stress: deterministic concurrency/recovery tests repeated in fresh-process stress runs
    flake_candidate(issue, owner, first_seen, signature): unexpected failure under active investigation; remains blocking
    quarantined(issue, owner, first_seen, quarantined_on, expires, signature, waiver=None): confirmed pass/fail nondeterminism in a time-bounded separate lane
    pglite: exercise the pglite PostgreSQL-compatibility lane; not real-PostgreSQL certification evidence
    postgresql: use the real-PostgreSQL fixture backend when --postgresql is enabled
    native_postgresql: require a native non-PGlite PostgreSQL server and governed certification accounting
