name: PR mutation broker

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  filter:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'dish-mutation-request:v1')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      valid: ${{ steps.filter.outputs.valid }}
      pr_number: ${{ steps.filter.outputs.pr_number }}
      request_comment_id: ${{ steps.filter.outputs.request_comment_id }}
    steps:
      - name: Check out trusted default-branch parser
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate structured mutation request
        id: filter
        run: >-
          python scripts/pr_lifecycle.py broker-filter
          --event-path "$GITHUB_EVENT_PATH"
          --github-output "$GITHUB_OUTPUT"

  broker:
    needs: filter
    if: needs.filter.outputs.valid == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: dish-pr-mutation-${{ needs.filter.outputs.pr_number }}
      queue: max
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: read
      statuses: read
    env:
      ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
      DISH_MUTATION_BROKER_MACHINE_IDENTITIES: ${{ vars.DISH_MUTATION_BROKER_MACHINE_IDENTITIES }}
      DISH_MUTATION_BROKER_ALLOWED_ROUTES_JSON: ${{ vars.DISH_MUTATION_BROKER_ALLOWED_ROUTES_JSON }}
    steps:
      - name: Resolve exact live default-branch source
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" --jq '.object.sha')"
          test "${#source_sha}" -eq 40
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact trusted broker source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.authority.outputs.source_sha }}
          persist-credentials: false

      - name: Re-read authority and prepare provisional event
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/pr_lifecycle.py broker-prepare
          --request-comment-id "${{ needs.filter.outputs.request_comment_id }}"
          --repository-id "${{ github.repository_id }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --trusted-source-sha "${{ steps.authority.outputs.source_sha }}"
          --proof-path "$RUNNER_TEMP/mutation-broker-proof.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Stage proof with canonical filename
        if: steps.prepare.outputs.requires_proof == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/broker-proof"
          cp "$RUNNER_TEMP/mutation-broker-proof.json" "$RUNNER_TEMP/broker-proof/mutation-broker-proof.json"

      - name: Upload immutable run-attempt proof
        if: steps.prepare.outputs.requires_proof == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/broker-proof/mutation-broker-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Finalize same event comment with proof transport identity
        if: steps.prepare.outputs.requires_proof == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/pr_lifecycle.py broker-finalize
          --comment-id "${{ steps.prepare.outputs.comment_id }}"
          --artifact-id "${{ steps.upload.outputs.artifact-id }}"
          --artifact-digest "${{ steps.upload.outputs.artifact-digest }}"
          --repository-id "${{ github.repository_id }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
