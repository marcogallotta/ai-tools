name: Exact-head PR certification

on:
  pull_request_review:
    branches: [main]
    types: [submitted]
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: pr-certification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan exact-head certification
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'commented'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
      issues: write
    outputs:
      eligible: ${{ steps.prepare.outputs.eligible }}
      candidate_sha: ${{ steps.prepare.outputs.candidate_sha }}
      plan_digest: ${{ steps.prepare.outputs.plan_digest }}
      selected_groups: ${{ steps.prepare.outputs.selected_groups }}
      all_boundary_fallback: ${{ steps.prepare.outputs.all_boundary_fallback }}
      selector_ok: ${{ steps.selector.outputs.selector_ok }}
      run_certification: ${{ steps.decision.outputs.run_certification }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.review.commit_id }}
          fetch-depth: 0

      - name: Load durable selector-gap history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p .test-artifacts/pr-certification
          gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            | jq 'add // []' > .test-artifacts/pr-certification/selector-gap-history.json

      - name: Build exact-head repository certification plan
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-artifacts/pr-certification
          python3 scripts/pr_certification.py prepare \
            --event-json "$GITHUB_EVENT_PATH" \
            --repo-root "$GITHUB_WORKSPACE" \
            --plan .test-artifacts/pr-certification/plan.json \
            --execution-spec .test-artifacts/pr-certification/execution-spec.json \
            --selector-gap-history .test-artifacts/pr-certification/selector-gap-history.json \
            --selector-gap-comments .test-artifacts/pr-certification/selector-gap-comments.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Persist durable selector-gap debt
        if: steps.prepare.outputs.eligible == 'true' && steps.prepare.outputs.selector_gap_count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          jq -c '.[]' .test-artifacts/pr-certification/selector-gap-comments.json | while read -r operation; do
            comment_id=$(jq -r '.existing_comment_id // empty' <<<"$operation")
            body=$(jq -r '.body' <<<"$operation")
            if [[ -n "$comment_id" ]]; then
              gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
            else
              gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
            fi
          done

      - name: Invalidate older certification status for this reviewed head
        if: steps.prepare.outputs.eligible == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            -f state=pending \
            -f context='Dish / exact-head certification' \
            -f description='Selector-driven certification is running' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Validate governed selector map before heavy allocation
        id: selector
        if: steps.prepare.outputs.eligible == 'true'
        shell: bash
        run: |
          set +e
          mkdir -p .test-artifacts/pr-certification
          python3 dish/scripts/dish-test-plan --validate \
            2>&1 | tee .test-artifacts/pr-certification/selector-map-validation.log
          rc=${PIPESTATUS[0]}
          if [[ "$rc" -eq 0 ]]; then
            echo 'selector_ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'selector_ok=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Publish selector-map failure without allocating certification runner
        if: steps.prepare.outputs.eligible == 'true' && steps.selector.outputs.selector_ok != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            -f state=failure \
            -f context='Dish / exact-head certification' \
            -f description='Governed selector map validation failed' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Decide whether to allocate certification runner
        id: decision
        if: steps.prepare.outputs.eligible == 'true'
        shell: bash
        env:
          SELECTOR_OK: ${{ steps.selector.outputs.selector_ok }}
        run: |
          set -euo pipefail
          if [[ "$SELECTOR_OK" == "true" ]]; then
            echo 'run_certification=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_certification=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload exact plan and execution spec
        if: steps.decision.outputs.run_certification == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-certification-plan-${{ steps.prepare.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-artifacts/pr-certification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  certify:
    name: Run selected certification groups
    needs: plan
    if: needs.plan.outputs.run_certification == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify exact formal Review candidate checkout
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Wait for exact certification plan artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ARTIFACT_NAME: pr-certification-plan-${{ needs.plan.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for poll in $(seq 1 60); do
            mapfile -t matches < <(
              gh api --paginate \
                -H 'Accept: application/vnd.github+json' \
                "/repos/$GITHUB_REPOSITORY/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.expired == false) | .name' \
                | grep -Fx "$PLAN_ARTIFACT_NAME" || true
            )
            if (( ${#matches[@]} == 1 )); then
              break
            fi
            if (( ${#matches[@]} > 1 )); then
              echo "Found duplicate current-attempt certification plan artifacts: $PLAN_ARTIFACT_NAME" >&2
              exit 1
            fi
            if (( poll == 60 )); then
              echo "Timed out waiting for current-attempt certification plan artifact: $PLAN_ARTIFACT_NAME" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Download exact certification plan
        uses: actions/download-artifact@v8
        with:
          name: pr-certification-plan-${{ needs.plan.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-artifacts/pr-certification

      - name: Execute only planner-selected targets
        id: certification
        uses: ./.github/actions/run-certification
        with:
          execution-spec: .test-artifacts/pr-certification/execution-spec.json
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          evidence-path: .test-artifacts/pr-certification/evidence.json

      - name: Upload exact-head certification evidence
        id: evidence-upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-certification-evidence-${{ needs.plan.outputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-artifacts/pr-certification/evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Publish terminal exact-head certification status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.plan.outputs.candidate_sha }}
          CERTIFICATION_OUTCOME: ${{ steps.certification.outcome }}
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.evidence-upload.outcome }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence-upload.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_URL: ${{ steps.evidence-upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          state=failure
          description='Selected certification targets failed'
          target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$CERTIFICATION_OUTCOME" == "success" ]]; then
            if [[ "$EVIDENCE_UPLOAD_OUTCOME" == "success" && -n "$EVIDENCE_ARTIFACT_ID" && -n "$EVIDENCE_ARTIFACT_URL" ]]; then
              state=success
              description='All planner-required certification targets passed with durable evidence'
              target_url="$EVIDENCE_ARTIFACT_URL"
            else
              description='Certification evidence publication failed'
            fi
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/statuses/$CANDIDATE_SHA" \
            -f state="$state" \
            -f context='Dish / exact-head certification' \
            -f description="$description" \
            -f target_url="$target_url"
