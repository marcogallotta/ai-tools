name: PR82 reconciliation retry
on:
  push:
    branches: [agent/d1-durable-review-routing]
permissions:
  contents: write
jobs:
  retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/d1-durable-review-routing
          fetch-depth: 0
      - name: Execute corrected reconciliation script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/pr82-merge-diagnose.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(src) if l.strip()=='run: |') + 1
          lines=[]
          for line in src[start:]:
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line.strip():
                  lines.append('')
              else:
                  break
          script='\n'.join(lines)+'\n'
          script=script.replace('python3 dish/scripts/chatgpt_project_kernels.py generate','python3 dish/scripts/chatgpt_project_kernels.py render')
          script=script.replace('python3 dish/scripts/chatgpt_project_kernels.py eval-validate\n','')
          script=script.replace('git rm .github/workflows/pr82-merge-diagnose.yml\n','git rm .github/workflows/pr82-merge-diagnose.yml .github/workflows/pr82-reconcile-retry.yml\n')
          Path('/tmp/pr82-reconcile.sh').write_text(script)
          PY
          bash /tmp/pr82-reconcile.sh
