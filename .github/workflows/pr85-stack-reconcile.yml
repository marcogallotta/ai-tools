name: PR85 stacked reconciliation
on:
  push:
    branches: [agent/quick-win-docs-process-sweep]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/quick-win-docs-process-sweep
          fetch-depth: 0
      - name: Merge PR82 and rebuild canonical Project increment
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/d1-durable-review-routing
          git config user.name 'Dish Agent Integration (GitHub Actions)'
          git config user.email 'dish-agent@users.noreply.github.com'
          git merge --no-commit --no-ff origin/agent/d1-durable-review-routing || true

          python3 - <<'PY'
          import ast, hashlib, importlib.util, json, re, subprocess
          from pathlib import Path

          def stage(n,path):
              return subprocess.check_output(['git','show',f':{n}:{path}'], text=True)

          # PR82 is the canonical lower layer. Overlay only PR85 quick-win rules.
          source=json.loads(stage(3,'dish/docs/chatgpt-projects/source.json'))
          q85=json.loads(stage(2,'dish/docs/chatgpt-projects/source.json'))
          wanted_shared={'human-facing-plain-language','marco-scoped-override','five-whys-shared-method'}
          by85={x['id']:x for x in q85['shared_rules']}
          concise={
            'human-facing-plain-language':'Marco-facing workflow text uses plain English; explain technical IDs/codenames instead of making them carry meaning.',
            'marco-scoped-override':'Honor Marco’s explicit scoped gate override; preserve raw evidence, record `GATE WAIVED BY MARCO OVERRIDE`, never widen scope or override genuine platform/system constraints.',
            'five-whys-shared-method':'For requested Five Whys/root-cause analysis, follow `dish/docs/agents/five-whys.md`; classify evidence/unknowns, do not force five or stop at blame.',
          }
          existing={x['id'] for x in source['shared_rules']}
          for rid in wanted_shared:
              x=dict(by85[rid]); x['text']=concise[rid]
              if rid not in existing: source['shared_rules'].append(x)
          dev85={x['id']:x for x in q85['roles']['development-workflow']['rules']}
          rid='development-workflow-asana-design-review-state'
          if rid not in {x['id'] for x in source['roles']['development-workflow']['rules']}:
              x=dict(dev85[rid])
              x['text']='Design/review state is canonical only after complete current design plus verdict/amendments are persisted and read back on the owning Asana task; fold accepted amendments into notes, and never let stale chat override task state.'
              source['roles']['development-workflow']['rules'].append(x)
          Path('dish/docs/chatgpt-projects/source.json').write_text(json.dumps(source,indent=2)+'\n')

          # Keep the complete PR82 eval matrix, append only PR85 quick-win scenarios.
          eval82=json.loads(stage(3,'dish/docs/chatgpt-projects/evals.json'))
          eval85=json.loads(stage(2,'dish/docs/chatgpt-projects/evals.json'))
          wanted_eval={'human-facing-plain-language','marco-scoped-override-preserves-evidence','five-whys-evidence-discipline','development-workflow-asana-design-review-state'}
          existing={x['id'] for x in eval82['scenarios']}
          lookup={x['id']:x for x in eval85['scenarios']}
          for sid in wanted_eval:
              if sid not in existing: eval82['scenarios'].append(lookup[sid])
          Path('dish/docs/chatgpt-projects/evals.json').write_text(json.dumps(eval82,indent=2,sort_keys=True)+'\n')

          # Keep PR82 generator and union PR85 eval IDs.
          path='dish/scripts/chatgpt_project_kernels.py'
          text=stage(3,path)
          pat=re.compile(r'^REQUIRED_EVAL_IDS=(\{.*\})$',re.M)
          m=pat.search(text)
          ids=set(ast.literal_eval(m.group(1))) | wanted_eval
          text=pat.sub('REQUIRED_EVAL_IDS='+repr(set(sorted(ids))),text,count=1)
          Path(path).write_text(text)

          # Keep PR82 tests, add PR85 quick-win test functions and make count dynamic.
          path='dish/tests/test_chatgpt_project_kernels.py'
          base=stage(3,path)
          ours=stage(2,path)
          names=(
            'test_shared_human_language_override_and_host_policy_are_deterministic',
            'test_five_whys_is_one_evidence_grounded_shared_method',
            'test_development_workflow_uses_owning_asana_task_as_design_review_state',
          )
          for name in names:
              if f'def {name}(' in base: continue
              match=re.search(rf'(?ms)^def {re.escape(name)}\([^\n]*\):\n.*?(?=^def |\Z)',ours)
              if not match: raise SystemExit(f'could not extract {name}')
              base += '\n\n' + match.group(0).rstrip() + '\n'
          base=base.replace("assert len(b['cases'])==81","assert len(b['cases'])==sum(len(q['roles']) for q in kernels._evals())")
          base=base.replace("evaluate_behavior_results(_passing()))==81","evaluate_behavior_results(_passing()))==sum(len(q['roles']) for q in kernels._evals())")
          Path(path).write_text(base)

          # Ownership map: PR82 baseline plus Five Whys row from PR85.
          path='dish/test_selection/ownership.csv'
          base=stage(3,path)
          row=next(line for line in stage(2,path).splitlines() if line.startswith('docs/agents/five-whys.md,'))
          if not any(line.startswith('docs/agents/five-whys.md,') for line in base.splitlines()):
              lines=base.splitlines(); idx=next(i for i,l in enumerate(lines) if l.startswith('docs/agents/identity.md,')); lines.insert(idx,row); base='\n'.join(lines)+'\n'
          Path(path).write_text(base)

          # Start manifest from exact PR82 canonical state and create a PR85-only edge.
          manifest=json.loads(stage(3,'dish/docs/chatgpt-projects/manifest.json'))
          old_version=manifest['canonical_version']
          spec=importlib.util.spec_from_file_location('stacked_kernels',Path('dish/scripts/chatgpt_project_kernels.py'))
          k=importlib.util.module_from_spec(spec); spec.loader.exec_module(k)
          base_source=json.loads(stage(3,'dish/docs/chatgpt-projects/source.json'))
          def fp(x):
              payload={q:x.get(q) for q in ('id','text','impact','surface','action_boundaries')}
              return hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          prior_shared={x['id']:fp(x) for x in k._rules(base_source.get('shared_rules'),'shared_rules')}
          prior_roles={r:{x['id']:fp(x) for x in k._rules(base_source['roles'][r].get('rules'),f'roles.{r}.rules')} for r in base_source['roles']}
          old_eff={r:{x['id']:x for x in k.effective_rules(base_source,r)} for r in base_source['roles']}
          new_eff={r:{x['id']:x for x in k.effective_rules(source,r)} for r in source['roles']}
          changed={}
          for role in sorted(source['roles']):
              for rid2 in sorted(set(old_eff[role])|set(new_eff[role])):
                  if old_eff[role].get(rid2)==new_eff[role].get(rid2): continue
                  x=new_eff[role].get(rid2) or old_eff[role][rid2]
                  key=(rid2,x['impact'],x['surface'],tuple(x['action_boundaries']))
                  changed.setdefault(key,[]).append(role)
          changes=[{'rule_id':rid2,'roles':roles,'impact':impact,'action_boundaries':list(bounds),'surface':surface} for (rid2,impact,surface,bounds),roles in sorted(changed.items())]
          if {x['rule_id'] for x in changes} != wanted_shared|{'development-workflow-asana-design-review-state'}:
              raise SystemExit(f'unexpected PR85 canonical rule delta: {changes}')
          kid=k.kernel_identity(source); new_version=f"{manifest['version_namespace']}-{kid[:12]}"
          manifest['canonical_version']=new_version
          manifest['kernel_identity_sha256']=kid
          manifest['source_sha256']=hashlib.sha256(json.dumps(source,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          manifest['generated_role_files']={r:f'{r}.md' for r in source['roles']}
          manifest['change_history'].append({'from_version':old_version,'to_version':new_version,'changes':changes,'from_rule_fingerprints':{'_shared':prior_shared,'_roles':prior_roles},'from_renderer_fingerprint':k.renderer_fingerprint()})
          Path('dish/docs/chatgpt-projects/manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print('stacked canonical version',new_version,'rule delta',sorted(x['rule_id'] for x in changes))
          PY

          # Generated files always come from the merged canonical source.
          for f in \
            dish/docs/chatgpt-projects/audit.md \
            dish/docs/chatgpt-projects/coordinator.md \
            dish/docs/chatgpt-projects/development-workflow.md \
            dish/docs/chatgpt-projects/implementation.md \
            dish/docs/chatgpt-projects/integration.md \
            dish/docs/chatgpt-projects/postgresql-dark-launch.md \
            dish/docs/chatgpt-projects/review.md \
            dish/docs/chatgpt-projects/workflow.md; do
            git checkout --theirs -- "$f"
          done
          python3 dish/scripts/chatgpt_project_kernels.py render
          python3 dish/scripts/chatgpt_project_kernels.py check
          git diff --check

          # Remove diagnostic/reconciliation transport before publishing the stacked head.
          git rm .github/workflows/pr85-stack-diagnose.yml .github/workflows/pr85-stack-reconcile.yml
          git add -A
          if git diff --name-only --diff-filter=U | grep .; then
            echo 'unresolved stacked conflicts remain' >&2; exit 1
          fi
          git commit -m 'Stack quick-win governance on D1 routing'
          git push origin HEAD:agent/quick-win-docs-process-sweep
