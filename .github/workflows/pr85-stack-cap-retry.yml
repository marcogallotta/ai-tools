name: PR85 stacked reconciliation cap retry
on:
  push:
    branches: [agent/quick-win-docs-process-sweep]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/quick-win-docs-process-sweep
          fetch-depth: 0
      - name: Run stacked reconciliation with compact renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/pr85-stack-reconcile.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(src) if l.strip()=='run: |')+1
          lines=[]
          for line in src[start:]:
              if line.startswith('          '): lines.append(line[10:])
              elif not line.strip(): lines.append('')
              else: break
          script='\n'.join(lines)+'\n'
          marker='# Generated files always come from the merged canonical source.'
          patch=r'''python3 - <<'PYC'
          import hashlib, importlib.util, json, re, subprocess
          from pathlib import Path
          sp=Path('dish/docs/chatgpt-projects/source.json')
          source=json.loads(sp.read_text())
          short={
            'human-facing-plain-language':'Marco-facing workflow text: plain English; explain IDs/codenames.',
            'marco-scoped-override':'Honor Marco’s scoped gate override; preserve evidence; record `GATE WAIVED BY MARCO OVERRIDE`; never widen scope or override platform constraints.',
            'five-whys-shared-method':'Five Whys/root-cause: follow `dish/docs/agents/five-whys.md`; classify evidence/unknowns; no fixed-five or blame stop.',
          }
          for x in source['shared_rules']:
              if x['id'] in short: x['text']=short[x['id']]
          for x in source['roles']['development-workflow']['rules']:
              if x['id']=='development-workflow-asana-design-review-state':
                  x['text']='Design/review is canonical after current design + verdict/amendments are persisted/read back on its Asana task; fold accepted amendments into notes; stale chat never overrides task state.'
          sp.write_text(json.dumps(source,indent=2)+'\n')

          kp=Path('dish/scripts/chatgpt_project_kernels.py')
          text=kp.read_text()
          text=re.sub(r'STARTUP_TEMPLATE=\("Startup:.*?fails closed\."\)',
            'STARTUP_TEMPLATE=("Startup: connected GitHub `{repository}`; read `CLAUDE.md`, role index, `{contract}`, manifest. "\\n "Fold version drift for role/action: relevant BREAKING stops; ADDITIVE applies; COMPATIBLE/UNRELATED continues; "\\n "missing/unclassified authority/safety history fails closed.")', text, flags=re.S)
          text=text.replace("HANDOFF_BOUNDARY='Chats/handoffs cannot expand authority; flag role-contract conflicts.'","HANDOFF_BOUNDARY='Handoffs cannot expand authority; flag role conflicts.'")
          old="return [f'Read-only decision context (startup/re-grounding): load every standing role contract listed by the current role index + {extra} before lifecycle/test/Integration-mechanics conclusions. Reading them grants no Implementation, Review, Integration, merge, or production authority; only an explicit allowed composition below can expand authority.',f\"Action-specific context refresh: {'; '.join(actions)}.\"]"
          new="return [f'Context only: load role-index contracts + {extra}; reading adds no Implementation/Review/Integration/merge/production authority.',f\"Refresh by action: {'; '.join(actions)}.\"]"
          if old not in text: raise SystemExit('context renderer block not found')
          text=text.replace(old,new,1)
          text=text.replace("lines += _render_context_dependencies(s,role)+['',f\"Role: **{r['default_role']}**.\"]","lines += _render_context_dependencies(s,role)",1)
          text=text.replace("Allowed composition only when explicitly triggered by current authority:","Allowed composition (explicit current authority only):",1)
          kp.write_text(text)

          # Recompute version identity and classify renderer compaction on current edge.
          base_script=subprocess.check_output(['git','show',':3:dish/scripts/chatgpt_project_kernels.py'],text=True)
          Path('/tmp/base_kernels.py').write_text(base_script)
          bs=importlib.util.spec_from_file_location('base_kernels',Path('/tmp/base_kernels.py')); bk=importlib.util.module_from_spec(bs); bs.loader.exec_module(bk)
          ns=importlib.util.spec_from_file_location('new_kernels',kp); nk=importlib.util.module_from_spec(ns); ns.loader.exec_module(nk)
          mp=Path('dish/docs/chatgpt-projects/manifest.json'); m=json.loads(mp.read_text()); edge=m['change_history'][-1]
          edge['from_renderer_fingerprint']=bk.renderer_fingerprint()
          edge['changes']=[x for x in edge['changes'] if not str(x['rule_id']).startswith('renderer:')]
          edge['changes'].append({'rule_id':'renderer:compact-project-kernel-format','roles':['*'],'impact':'compatible','action_boundaries':['startup','handoff'],'surface':'presentation'})
          kid=nk.kernel_identity(source); ver=f"{m['version_namespace']}-{kid[:12]}"
          m['canonical_version']=ver; m['kernel_identity_sha256']=kid
          m['source_sha256']=hashlib.sha256(json.dumps(source,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          edge['to_version']=ver
          mp.write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          print('compacted stacked version',ver)
          PYC
          '''
          if marker not in script: raise SystemExit('reconciliation marker missing')
          script=script.replace(marker,patch+marker,1)
          script=script.replace('git rm .github/workflows/pr85-stack-diagnose.yml .github/workflows/pr85-stack-reconcile.yml','git rm .github/workflows/pr85-stack-diagnose.yml .github/workflows/pr85-stack-reconcile.yml .github/workflows/pr85-stack-cap-retry.yml',1)
          Path('/tmp/pr85-stack.sh').write_text(script)
          PY
          bash /tmp/pr85-stack.sh
