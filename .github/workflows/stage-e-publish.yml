name: Stage E branch publication cleanup

on:
  push:
    branches: [agent/stage-e-certification-convergence]

permissions:
  contents: write

jobs:
  finalize-selector-row:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage-e-certification-convergence
          fetch-depth: 0

      - name: Add missing selector classification and remove one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('dish/test_selection/ownership.csv')
          row = 'docs/agents/templates/implementation-handoff.md,documentation,1,1,agent-policy; documentation,,,none,,,,'
          lines = path.read_text(encoding='utf-8').splitlines()
          if row not in lines:
              lines.append(row)
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 dish/scripts/dish-test-plan --validate
          git rm .github/workflows/stage-e-publish.yml
          git add dish/test_selection/ownership.csv
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Classify Stage E implementation handoff path'
          git push origin HEAD:agent/stage-e-certification-convergence
