name: Agent Search review fix

on:
  push:
    branches:
      - agent/dish-search-surfaces

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dish/requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r dish/requirements-test.txt
      - name: Apply bounded Review corrections
        working-directory: dish
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'dish_pg/command_contract.py',
              '''def _validate_search_action_request(\n    request: Mapping[str, Any],\n) -> tuple[dict[str, Any], dict[str, Any]]:\n    raw_arguments = request.get("arguments") if isinstance(request, Mapping) else None\n    agent = raw_arguments.get("agent") if isinstance(raw_arguments, Mapping) else None\n    adapted = dict(request) if isinstance(request, Mapping) else request\n    if isinstance(adapted, dict):\n        adapted["arguments"] = {"agent": agent}\n    client, _ = validate_legacy_action_request(SECTIONS_COMMAND.name, adapted)\n    if not isinstance(raw_arguments, Mapping):\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "arguments must be an object",\n            rule="argument_object_required",\n        )\n    allowed = {"query", "agent", "cursor", "page_size"}\n    unknown = sorted(set(raw_arguments) - allowed)\n    if unknown:\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "search arguments contain unsupported fields",\n            rule="argument_field_forbidden",\n            details={"fields": unknown},\n        )\n    query = raw_arguments.get("query")\n    if not isinstance(query, str):\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "query must be a string",\n            rule="argument_type_invalid",\n            details={"field": "query"},\n        )\n    clean_query = query.strip()\n    if not clean_query:\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "query is required",\n            rule="search_query_required",\n            details={"field": "query"},\n        )\n    if len(clean_query) > SEARCH_QUERY_MAX_LENGTH:\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "query is too long",\n            rule="search_query_too_long",\n            details={"field": "query", "maximum": SEARCH_QUERY_MAX_LENGTH},\n        )\n    cursor = raw_arguments.get("cursor")\n    if cursor is not None and (not isinstance(cursor, str) or not cursor):\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "cursor must be a non-empty string when provided",\n            rule="argument_type_invalid",\n            details={"field": "cursor"},\n        )\n    page_size = raw_arguments.get("page_size", SEARCH_PAGE_SIZE_DEFAULT)\n    if isinstance(page_size, bool) or not isinstance(page_size, int):\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "page_size must be an integer",\n            rule="argument_type_invalid",\n            details={"field": "page_size"},\n        )\n    if not 1 <= page_size <= SEARCH_PAGE_SIZE_MAX:\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "page_size is outside the supported range",\n            rule="argument_range_invalid",\n            details={"field": "page_size", "minimum": 1, "maximum": SEARCH_PAGE_SIZE_MAX},\n        )\n    return client, {\n        "query": clean_query,\n        "agent": agent,\n        "page_size": page_size,\n        **({"cursor": cursor} if cursor is not None else {}),\n    }\n''',
              '''def normalize_postgres_search_arguments(arguments: Mapping[str, Any]) -> dict[str, Any]:\n    """Normalize the one PostgreSQL Search argument contract for every transport."""\n\n    if not isinstance(arguments, Mapping):\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "arguments must be an object",\n            rule="argument_object_required",\n        )\n    allowed = {"query", "agent", "cursor", "page_size"}\n    unknown = sorted(set(arguments) - allowed)\n    if unknown:\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "search arguments contain unsupported fields",\n            rule="argument_field_forbidden",\n            details={"fields": unknown},\n        )\n    agent = arguments.get("agent")\n    if not isinstance(agent, str) or agent not in _SEARCH_AGENT_VALUES:\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "agent must name a supported agent family",\n            rule="argument_value_invalid",\n            details={"field": "agent", "allowed": list(_SEARCH_AGENT_VALUES)},\n        )\n    query = arguments.get("query")\n    if not isinstance(query, str):\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "query must be a string",\n            rule="argument_type_invalid",\n            details={"field": "query"},\n        )\n    clean_query = query.strip()\n    if not clean_query:\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "query is required",\n            rule="search_query_required",\n            details={"field": "query"},\n        )\n    if len(clean_query) > SEARCH_QUERY_MAX_LENGTH:\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "query is too long",\n            rule="search_query_too_long",\n            details={"field": "query", "maximum": SEARCH_QUERY_MAX_LENGTH},\n        )\n    cursor = arguments.get("cursor")\n    if cursor is not None and (not isinstance(cursor, str) or not cursor):\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "cursor must be a non-empty string when provided",\n            rule="argument_type_invalid",\n            details={"field": "cursor"},\n        )\n    page_size = arguments.get("page_size", SEARCH_PAGE_SIZE_DEFAULT)\n    if isinstance(page_size, bool) or not isinstance(page_size, int):\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "page_size must be an integer",\n            rule="argument_type_invalid",\n            details={"field": "page_size"},\n        )\n    if not 1 <= page_size <= SEARCH_PAGE_SIZE_MAX:\n        raise DishRuleError(\n            "INVALID_ARGUMENT",\n            "page_size is outside the supported range",\n            rule="argument_range_invalid",\n            details={"field": "page_size", "minimum": 1, "maximum": SEARCH_PAGE_SIZE_MAX},\n        )\n    return {\n        "query": clean_query,\n        "agent": agent,\n        "page_size": page_size,\n        **({"cursor": cursor} if cursor is not None else {}),\n    }\n\n\ndef _validate_search_action_request(\n    request: Mapping[str, Any],\n) -> tuple[dict[str, Any], dict[str, Any]]:\n    raw_arguments = request.get("arguments") if isinstance(request, Mapping) else None\n    adapted = dict(request) if isinstance(request, Mapping) else request\n    if isinstance(adapted, dict):\n        # Reuse the settled Action client-envelope validator without making it\n        # a second authority for Search's argument semantics.\n        adapted["arguments"] = {"agent": "gpt"}\n    client, _ = validate_legacy_action_request(SECTIONS_COMMAND.name, adapted)\n    return client, normalize_postgres_search_arguments(raw_arguments)\n''',
          )

          replace_once(
              'dish_pg/frontend_board_query.py',
              '''class SearchFact:\n    task_id: UUID\n    title: str\n    section_label: str\n    project_label: str\n''',
              '''class SearchFact:\n    task_id: UUID\n    title: str\n    section_id: UUID\n    section_label: str\n    workflow_role: str\n    project_label: str\n''',
          )
          replace_once(
              'dish_pg/frontend_board_query.py',
              '''    def search_titles(\n        self,\n        *,\n        query: str,\n        projection_delay: timedelta,\n        max_results: int,\n    ) -> SearchFacts:\n''',
              '''    def search_titles(\n        self,\n        *,\n        query: str,\n        projection_delay: timedelta,\n        max_results: int,\n        context: BoardContext | None = None,\n    ) -> SearchFacts:\n''',
          )
          replace_once(
              'dish_pg/frontend_board_query.py',
              '''        context = self.context()\n        normalized = query.lower()\n''',
              '''        context = context or self.context()\n        normalized = query.lower()\n''',
          )
          replace_once(
              'dish_pg/frontend_board_query.py',
              '''                SearchFact(\n                    task_id=row["task_id"],\n                    title=row["title"],\n                    section_label=row["section_label"],\n                    project_label=row["project_label"],\n                )\n''',
              '''                SearchFact(\n                    task_id=row["task_id"],\n                    title=row["title"],\n                    section_id=row["section_id"],\n                    section_label=row["section_label"],\n                    workflow_role=row["workflow_role"],\n                    project_label=row["project_label"],\n                )\n''',
          )
          replace_once(
              'dish_pg/frontend_board_query.py',
              '''                ).label("section_label"),\n                models.GovernedProject.logical_name.label("project_label"),\n''',
              '''                ).label("section_label"),\n                models.SectionRegistryEntry.workflow_role.label("workflow_role"),\n                models.GovernedProject.logical_name.label("project_label"),\n''',
          )

          replace_once(
              'dish_pg/postgres_service.py',
              '''    SEARCH_COMMAND,\n    SEARCH_PAGE_SIZE_DEFAULT,\n    validate_postgres_action_request,\n''',
              '''    SEARCH_COMMAND,\n    SEARCH_PAGE_SIZE_DEFAULT,\n    normalize_postgres_search_arguments,\n    validate_postgres_action_request,\n''',
          )
          start = Path('dish_pg/postgres_service.py').read_text(encoding='utf-8')
          old_search_start = start.index('    def _execute_search(\n')
          old_execute_start = start.index('    def _execute_command(\n', old_search_start)
          new_search = '''    def _execute_search(\n        self,\n        session,\n        arguments: Mapping[str, Any],\n    ) -> CommandResult:\n        query = str(arguments["query"])\n        page_size = int(arguments["page_size"])\n        reads = PostgresReadModel(session, cursor_secret=self._cursor_secret)\n        board = FrontendBoardQuery(session)\n        context = board.context()\n        normalized_query = query.lower()\n        offset = 0\n        cursor = arguments.get("cursor")\n        if cursor is not None:\n            try:\n                payload = reads.cursor_codec.decode(str(cursor))\n            except InvalidCursor as exc:\n                return CommandResult(\n                    False,\n                    SEARCH_COMMAND,\n                    "INVALID_ARGUMENT",\n                    400,\n                    {"message": str(exc), "field": "cursor"},\n                )\n            expected = {\n                "kind": _SEARCH_CURSOR_KIND,\n                "generation_id": str(context.generation_id),\n                "registry_version_id": str(context.registry_version_id),\n                "registry_revision": context.registry_revision,\n                "query": normalized_query,\n                "page_size": page_size,\n            }\n            if any(payload.get(key) != value for key, value in expected.items()):\n                return CommandResult(\n                    False,\n                    SEARCH_COMMAND,\n                    "INVALID_ARGUMENT",\n                    400,\n                    {"message": "cursor is stale or belongs to another search query", "field": "cursor"},\n                )\n            try:\n                offset = int(payload["offset"])\n            except (KeyError, TypeError, ValueError):\n                return CommandResult(\n                    False,\n                    SEARCH_COMMAND,\n                    "INVALID_ARGUMENT",\n                    400,\n                    {"message": "cursor page boundary is invalid", "field": "cursor"},\n                )\n            if offset < 0:\n                return CommandResult(\n                    False,\n                    SEARCH_COMMAND,\n                    "INVALID_ARGUMENT",\n                    400,\n                    {"message": "cursor page boundary is invalid", "field": "cursor"},\n                )\n\n        # The settled frontend primitive owns title matching, active-corpus membership,\n        # placement, section-registry metadata, and deterministic ordering. Passing the\n        # captured context makes every returned Search fact belong to the same authority\n        # identity that validates and signs the continuation cursor.\n        facts = board.search_titles(\n            query=query,\n            projection_delay=_SEARCH_PROJECTION_DELAY,\n            max_results=offset + page_size + 1,\n            context=context,\n        )\n        visible = facts.results[offset : offset + page_size]\n        has_more = facts.truncated or len(facts.results) > offset + page_size\n        results: list[dict[str, Any]] = []\n        for fact in visible:\n            task_gid = session.scalar(\n                select(models.TaskExternalAlias.external_id).where(\n                    models.TaskExternalAlias.task_id == fact.task_id,\n                    models.TaskExternalAlias.external_system == "asana",\n                    models.TaskExternalAlias.state == "active",\n                )\n            )\n            if task_gid is None:\n                return CommandResult(\n                    False,\n                    SEARCH_COMMAND,\n                    "BACKEND_REJECTED",\n                    409,\n                    {\n                        "message": "active Search result lacks its exact persisted task alias",\n                        "dish_id": str(fact.task_id),\n                    },\n                )\n            results.append(\n                {\n                    "dish_id": str(fact.task_id),\n                    "task_gid": str(task_gid),\n                    "title": fact.title,\n                    "section_id": str(fact.section_id),\n                    "section_label": fact.section_label,\n                    "workflow_role": fact.workflow_role,\n                    "project_label": fact.project_label,\n                }\n            )\n\n        current_context = board.context()\n        current_identity = (\n            current_context.generation_id,\n            current_context.registry_version_id,\n            current_context.registry_revision,\n        )\n        captured_identity = (\n            context.generation_id,\n            context.registry_version_id,\n            context.registry_revision,\n        )\n        if current_identity != captured_identity:\n            return CommandResult(\n                False,\n                SEARCH_COMMAND,\n                "BACKEND_REJECTED",\n                409,\n                {\n                    "message": "Search authority context changed during the read; retry from the first page",\n                    "captured_generation_id": str(context.generation_id),\n                    "captured_registry_version_id": str(context.registry_version_id),\n                    "captured_registry_revision": context.registry_revision,\n                },\n                retryable=True,\n            )\n\n        next_cursor = None\n        if has_more:\n            next_cursor = reads.cursor_codec.encode(\n                {\n                    "kind": _SEARCH_CURSOR_KIND,\n                    "generation_id": str(context.generation_id),\n                    "registry_version_id": str(context.registry_version_id),\n                    "registry_revision": context.registry_revision,\n                    "query": normalized_query,\n                    "page_size": page_size,\n                    "offset": offset + page_size,\n                }\n            )\n        return CommandResult(\n            True,\n            SEARCH_COMMAND,\n            "OK",\n            200,\n            {\n                "query": query,\n                "results": results,\n                "next_cursor": next_cursor,\n                "page_size": page_size,\n                "generation_id": str(context.generation_id),\n                "registry_version_id": str(context.registry_version_id),\n                "registry_revision": context.registry_revision,\n            },\n        )\n\n'''
          Path('dish_pg/postgres_service.py').write_text(
              start[:old_search_start] + new_search + start[old_execute_start:],
              encoding='utf-8',
          )
          replace_once(
              'dish_pg/postgres_service.py',
              '''                if command == SEARCH_COMMAND:\n                    if parsed_request_id is not None:\n                        result = CommandResult(\n                            False,\n                            SEARCH_COMMAND,\n                            "INVALID_ARGUMENT",\n                            400,\n                            {"message": "read-only Search does not accept request_id"},\n                        )\n                    else:\n                        result = self._execute_search(session, arguments)\n''',
              '''                if command == SEARCH_COMMAND:\n                    if parsed_request_id is not None:\n                        result = CommandResult(\n                            False,\n                            SEARCH_COMMAND,\n                            "INVALID_ARGUMENT",\n                            400,\n                            {"message": "read-only Search does not accept request_id"},\n                        )\n                    else:\n                        try:\n                            search_arguments = normalize_postgres_search_arguments(arguments)\n                        except DishRuleError as exc:\n                            result = CommandResult(\n                                False,\n                                SEARCH_COMMAND,\n                                exc.code,\n                                400,\n                                {"message": str(exc), **dict(exc.details)},\n                            )\n                        else:\n                            result = self._execute_search(session, search_arguments)\n''',
          )

          replace_once(
              'docs/architecture/commands-and-surfaces.md',
              '''The retained PostgreSQL connected inventory is `create`, `sections`, `section-tasks`, `read`,\n`proposals`, `apply-proposal`, `safe-reclaim`, `inspect`, `start`, `prepare`, `approve`, `reject`,\n''',
              '''The retained PostgreSQL connected inventory is `create`, `sections`, `section-tasks`, `search`, `read`,\n`proposals`, `apply-proposal`, `safe-reclaim`, `inspect`, `start`, `prepare`, `approve`, `reject`,\n''',
          )

          replace_once(
              'tests/postgresql/test_postgres_runtime_validation_http.py',
              '''from dish_tool.errors import DishRuleError\nfrom tests.support.postgresql.runtime_validation import (\n''',
              '''from dish_tool.errors import DishRuleError\nfrom tests.support.postgresql.core import _import_one\nfrom tests.support.postgresql.runtime_validation import (\n''',
          )
          marker = 'def test_postgresql_runtime_exposes_only_implemented_action_commands(\n'
          p = Path('tests/postgresql/test_postgres_runtime_validation_http.py')
          text = p.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit('runtime validation test insertion marker drifted')
          tests = '''def test_postgresql_agent_search_normalizes_and_paginates_with_strict_progress(\n    workflow_db, tmp_path: Path\n) -> None:\n    factory, ids, context, first_task_id = workflow_db\n    with session_scope(factory) as session:\n        second = _import_one(session, ids, context, asana_gid="123456790")\n        third = _import_one(session, ids, context, asana_gid="123456791")\n\n    run_id = _next(ids)\n    service = runtime_service(factory, tmp_path)\n    with DishHTTPServer(("127.0.0.1", 0), service, surface_mode="private") as server:\n        thread = start_server_thread(server, name="postgres-search-agent-http")\n        url = f"http://127.0.0.1:{server.server_address[1]}/v1/commands/search"\n        try:\n            cursor = None\n            seen: list[str] = []\n            emitted: list[str] = []\n            for index in range(3):\n                arguments = {\n                    "query": "  IMPORTED  " if index == 0 else "IMPORTED",\n                    "agent": "gpt",\n                    "page_size": 1,\n                }\n                if cursor is not None:\n                    arguments["cursor"] = cursor\n                status, result = _post_json(\n                    url,\n                    body={\n                        "client": {"run_id": str(run_id)},\n                        "arguments": arguments,\n                    },\n                )\n                assert status == 200\n                assert result["ok"] is True\n                assert result["data"]["query"] == "IMPORTED"\n                assert result["data"]["page_size"] == 1\n                assert len(result["data"]["results"]) == 1\n                seen.append(result["data"]["results"][0]["dish_id"])\n                next_cursor = result["data"]["next_cursor"]\n                if next_cursor is not None:\n                    assert next_cursor != cursor\n                    emitted.append(next_cursor)\n                cursor = next_cursor\n        finally:\n            stop_server(server, thread)\n\n    assert seen == sorted(\n        [str(first_task_id), str(second.task_id), str(third.task_id)]\n    )\n    assert len(set(seen)) == 3\n    assert len(set(emitted)) == 2\n    assert cursor is None\n\n\ndef test_postgresql_agent_search_rejects_invalid_pagination_before_execution(\n    workflow_db, tmp_path: Path\n) -> None:\n    factory, ids, _context, _task_id = workflow_db\n    run_id = _next(ids)\n    service = runtime_service(factory, tmp_path)\n    with DishHTTPServer(("127.0.0.1", 0), service, surface_mode="private") as server:\n        thread = start_server_thread(server, name="postgres-search-invalid-http")\n        url = f"http://127.0.0.1:{server.server_address[1]}/v1/commands/search"\n        try:\n            for arguments in (\n                {"query": "imported", "agent": "gpt", "page_size": 0},\n                {"query": "imported", "agent": "gpt", "page_size": 101},\n                {"query": "imported", "agent": "gpt", "cursor": ""},\n            ):\n                status, result = _post_json(\n                    url,\n                    body={\n                        "client": {"run_id": str(run_id)},\n                        "arguments": arguments,\n                    },\n                )\n                assert status == 200\n                assert result["ok"] is False\n                assert result["code"] == "INVALID_ARGUMENT"\n                assert "next_cursor" not in result["data"]\n\n            status, result = _post_json(\n                url,\n                body={\n                    "client": {"run_id": str(run_id)},\n                    "arguments": {\n                        "query": "imported",\n                        "agent": "gpt",\n                        "cursor": "not-an-authenticated-search-cursor",\n                    },\n                },\n            )\n            assert status == 200\n            assert result["ok"] is False\n            assert result["code"] == "INVALID_ARGUMENT"\n            assert result["data"]["field"] == "cursor"\n            assert "next_cursor" not in result["data"]\n        finally:\n            stop_server(server, thread)\n\n\n'''
          p.write_text(text.replace(marker, tests + marker), encoding='utf-8')

          replace_once(
              'tests/postgresql/native/test_frontend_local_board.py',
              '''from datetime import timedelta\n\nimport pytest\n\nfrom dish_pg.database import session_scope\n''',
              '''from dataclasses import replace\nfrom datetime import timedelta\n\nimport pytest\n\nfrom dish_pg import postgres_service as postgres_service_module\nfrom dish_pg.database import session_scope\nfrom dish_pg.frontend_board_query import FrontendBoardQuery\nfrom dish_service.leases import ServicePrincipal\n''',
          )
          replace_once(
              'tests/postgresql/native/test_frontend_local_board.py',
              '''from tests.support.postgresql.core import _bootstrap_registry, _import_one, _next, core_db\n''',
              '''from tests.support.postgresql.core import _bootstrap_registry, _import_one, _next, core_db\nfrom tests.support.postgresql.runtime_validation import runtime_service\n''',
          )
          p = Path('tests/postgresql/native/test_frontend_local_board.py')
          text = p.read_text(encoding='utf-8')
          text += '''\n\ndef test_search_refuses_success_when_registry_identity_rolls_between_read_and_response_fence(\n    core_db, tmp_path, monkeypatch\n) -> None:\n    factory, ids = core_db\n    with session_scope(factory) as session:\n        context = _bootstrap_registry(\n            session,\n            ids,\n            generation_status="active",\n            schema_head="0032_imported_operation_history",\n        )\n        task_id = _next(ids)\n        _import_one(session, ids, context, task_id=task_id)\n\n    class RolloverBoardQuery(FrontendBoardQuery):\n        def __init__(self, session):\n            super().__init__(session)\n            self._context_reads = 0\n\n        def context(self):\n            current = super().context()\n            self._context_reads += 1\n            if self._context_reads == 1:\n                return current\n            return replace(current, registry_revision=current.registry_revision + 1)\n\n    monkeypatch.setattr(\n        postgres_service_module,\n        "FrontendBoardQuery",\n        RolloverBoardQuery,\n    )\n    service = runtime_service(factory, tmp_path)\n    principal = ServicePrincipal.from_values("cli", str(_next(ids)))\n    result = service.execute_agent(\n        "search",\n        {"query": "imported", "agent": "gpt", "page_size": 1},\n        principal=principal,\n        request_id=None,\n    )\n\n    assert result["ok"] is False\n    assert result["code"] == "BACKEND_REJECTED"\n    assert result["retryable"] is True\n    assert "results" not in result["data"]\n    assert "next_cursor" not in result["data"]\n    assert result["data"]["captured_generation_id"] == str(context["generation_id"])\n    assert result["data"]["captured_registry_version_id"] == str(\n        context["registry_version_id"]\n    )\n'''
          p.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate PostgreSQL Action OpenAPI
        working-directory: dish
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from dish_pg.openapi import postgres_action_openapi
          path = Path('openapi/dish-postgresql-action.openapi.json')
          path.write_text(json.dumps(postgres_action_openapi(), indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Plan and run focused evidence
        working-directory: dish
        run: |
          python scripts/dish-test-plan --base a1e7e2496b454ab590ac89ac0fe820073e4f004e
          python -m py_compile dish_pg/command_contract.py dish_pg/frontend_board_query.py dish_pg/postgres_service.py dish_service/cli.py dish_service/http.py
          pytest -q tests/postgresql/test_postgresql_action_openapi_oracle.py tests/postgresql/test_postgres_runtime_validation_http.py tests/postgresql/test_frontend_board_read.py
      - name: Run native PostgreSQL coherence regression
        working-directory: dish
        env:
          DISH_POSTGRES_DB: dish_search_review_test
          DISH_POSTGRES_USER: dish
          DISH_POSTGRES_PASSWORD: dish
          DISH_POSTGRES_HOST_PORT: '55432'
          DISH_TEST_POSTGRESQL_DSN: postgresql+psycopg://dish:dish@127.0.0.1:55432/dish_search_review_test
        run: |
          docker compose -f deploy/postgresql/compose.yaml up -d --wait
          pytest -q --postgresql tests/postgresql/native/test_frontend_local_board.py
          docker compose -f deploy/postgresql/compose.yaml down -v
      - name: Publish bounded fix and remove temporary workflow
        run: |
          git config user.name 'Dish Agent: Implementation | ChatGPT'
