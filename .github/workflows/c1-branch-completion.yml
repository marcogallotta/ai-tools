name: C1 exact rebuild and publish

on:
  push:
    branches:
      - agent/c1-role-kernel-governance

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Rebuild exact C1 candidate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=a97b6b236eee3ec115bb434209f40331544415d5
          base=9f43db73f9ccfbdcb06e284cf7e7bc5858482b67
          target_tree=8bb2e0e59f17087a3b55b007089ae83a064f0ed7
          script_blob=b08ce8eacdbbd6311b2d08be554728849930285a
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          git cat-file -e "$base^{commit}"

          git rm -r -q .
          git checkout "$base" -- .

          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          sha='b08ce8eacdbbd6311b2d08be554728849930285a'
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req) as r: obj=json.load(r)
          gz=base64.b64decode(''.join(obj['content'].split()),validate=True)
          assert hashlib.sha256(gz).hexdigest()=='d2ee42d0a1ced0cd371b14f8c7a3306b0d912abf9fdd04dd25afc773845c1575'
          raw=gzip.decompress(gz)
          assert hashlib.sha256(raw).hexdigest()=='8424d06600484695366b411a4a3aaef7ef58c671fb95515b49f7a4cb40f40080'
          pathlib.Path('/tmp/rebuild_c1.py').write_bytes(raw)
          PY

          python3 /tmp/rebuild_c1.py
          python3 dish/scripts/chatgpt_project_kernels.py render
          python3 dish/scripts/chatgpt_project_kernels.py check
          python3 dish/scripts/chatgpt_project_kernels.py prepare-eval --output /tmp/c1-eval.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/c1-eval.json'))
          assert len(p['cases'])==73
          assert len({c['role'] for c in p['cases']})==8
          PY
          git add -A
          git diff --cached --check
          actual_tree=$(git write-tree)
          echo "candidate tree=$actual_tree"
          test "$actual_tree" = "$target_tree"

          git config user.name 'Dish Agent Implementation (ChatGPT)'
          git config user.email 'dish-agent@users.noreply.github.com'
          git commit -m 'Add consolidated role kernel governance'
          test "$(git rev-parse HEAD^{tree})" = "$target_tree"
          git push origin HEAD:agent/c1-role-kernel-governance
