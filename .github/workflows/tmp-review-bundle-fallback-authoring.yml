name: Temporary Review bundle fallback authoring

on:
  push:
    branches:
      - agent/review-bundle-fallback

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Apply canonical Review fallback policy and evals
        shell: bash
        run: |
          set -euo pipefail
          cp dish/docs/chatgpt-projects/source.json /tmp/base-source.json
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          source_path = Path('dish/docs/chatgpt-projects/source.json')
          source = json.loads(source_path.read_text())
          review_rules = source['roles']['review']['rules']
          rule = {
              'id': 'review-bundle-fallback',
              'text': 'ChatGPT PR Review treats the repository bundle as a preferred context cache, not an availability gate. If unavailable, proceed from live connector-native evidence: repository/current main, exact PR base/head and complete diff, relevant current authority/files, linked task/decisions, prior Review/comments, and available CI/evidence. Never block, route local, or ask Marco solely for bundle transport. Reject any used stale, mismatched, corrupt, or wrong-SHA bundle; fail closed only on a named unresolved semantic, tool, or environment evidence boundary.',
              'impact': 'additive',
              'surface': 'routing',
              'action_boundaries': ['review-write', 'handoff'],
              'delivery': {'mode': 'DIRECT_ALWAYS_ON'},
          }
          existing = next((x for x in review_rules if x.get('id') == rule['id']), None)
          if existing is None:
              anchor = next(i for i, x in enumerate(review_rules) if x.get('id') == 'review-repository-context')
              review_rules.insert(anchor + 1, rule)
          elif existing != rule:
              raise SystemExit('conflicting existing review-bundle-fallback rule')
          source_path.write_text(json.dumps(source, indent=2, sort_keys=True) + '\n')

          review_path = Path('dish/docs/agents/review.md')
          review_text = review_path.read_text()
          contract = (
              'For ChatGPT PR Review, the repository bundle is a preferred context accelerator/cache, not a blanket availability prerequisite. '
              'Resolve live repository/current-main identity and the exact PR base/head first. If the exact bundle is readily retrievable, verify and use it; '
              'if it is unavailable, continue from connector-native exact evidence: the complete PR diff/changed files, relevant current-main authority/files, linked task/decisions, '
              'prior formal Review/comments, and available CI/evidence. Missing bundle transport alone must not yield `LOCAL REVIEW REQUIRED`, `BLOCKED`, a Marco waiver/action, '
              'or local relay. If a bundle is used, reject stale, mismatched, corrupt, or wrong-SHA content and never substitute another SHA. Fail closed or route local only for a named '
              'unresolved semantic guarantee whose required repository/history/tool/environment evidence is genuinely unavailable.'
          )
          if contract not in review_text:
              anchor = ('If the PR omits its owning task or enough durable implementation context, request that context on the PR. '
                        'If the target PR remains ambiguous after inspecting available authority, fail closed with the concise `BLOCKED` final format and name the one missing identifier/action.\n')
              if anchor not in review_text:
                  raise SystemExit('review contract insertion anchor missing')
              review_text = review_text.replace(anchor, anchor + '\n' + contract + '\n', 1)
              review_path.write_text(review_text)

          evals_path = Path('dish/docs/chatgpt-projects/evals.json')
          payload = json.loads(evals_path.read_text())
          scenarios = payload['scenarios']
          additions = [
              {
                  'id': 'review-bundle-unavailable-proceeds',
                  'roles': ['review'],
                  'required_rules': ['repository-context-admission', 'review-repository-context', 'review-bundle-fallback'],
                  'prompt': 'Review a Dish PR. The exact current repository bundle cannot be discovered or retrieved, but connected GitHub/Asana provide live repository and current-main identity, exact PR base/head, the complete diff and changed files, relevant current-main authority/files, the linked task and durable decisions, prior formal Review/comments, and available CI/evidence. What do you do?',
                  'expected_outcome': 'proceed_with_connector_native_review',
                  'required_actions': ['resolve-exact-pr-and-live-authority', 'use-connector-native-review-evidence', 'proceed-substantive-review'],
                  'forbidden_actions': ['block-for-bundle-transport-only', 'route-local-for-bundle-transport-only', 'ask-marco-for-bundle-waiver-or-relay'],
              },
              {
                  'id': 'review-real-evidence-boundary-routes-local',
                  'roles': ['review'],
                  'required_rules': ['repository-context-admission', 'review-bundle-fallback'],
                  'prompt': 'Review a Dish PR with no retrievable repository bundle. Connector-native repository, PR, task, diff, and current-main evidence are sufficient for the source review, but one merge-critical guarantee specifically requires a native local environment check unavailable to this Review host. What do you do?',
                  'expected_outcome': 'route_only_named_missing_evidence_boundary',
                  'required_actions': ['name-unresolved-semantic-guarantee', 'route-exact-local-evidence-boundary'],
                  'forbidden_actions': ['block-for-bundle-transport-only', 'ask-marco-for-bundle-waiver-or-relay'],
              },
              {
                  'id': 'review-stale-bundle-rejected',
                  'roles': ['review'],
                  'required_rules': ['repository-context-admission', 'review-bundle-fallback'],
                  'prompt': 'Review a Dish PR. A repository bundle is available but verification shows it is stale, corrupt, mismatched, or advertises the wrong SHA. Live connector-native exact PR/current-main/task evidence is otherwise sufficient for the merge question. What do you do?',
                  'expected_outcome': 'reject_invalid_bundle_and_use_safe_exact_evidence',
                  'required_actions': ['reject-invalid-bundle', 'refuse-different-sha-substitution', 'use-connector-native-review-evidence'],
                  'forbidden_actions': ['treat-invalid-bundle-as-current', 'substitute-different-bundle-sha'],
              },
              {
                  'id': 'review-bundle-outage-regression-fixtures',
                  'roles': ['review'],
                  'required_rules': ['review-bundle-fallback'],
                  'prompt': 'Regression fixture for the PR #147/#151/#158 failure class: exact repository-bundle discovery is unavailable, while exact connector-native PR/base/head/diff/current-main/task/Review/CI evidence is sufficient. Continue the Review workflow without asking Marco to waive the bundle gate.',
                  'expected_outcome': 'review_fixture_proceeds_without_human_bundle_action',
                  'required_actions': ['use-connector-native-review-evidence', 'proceed-substantive-review'],
                  'forbidden_actions': ['block-for-bundle-transport-only', 'route-local-for-bundle-transport-only', 'ask-marco-for-bundle-waiver-or-relay'],
              },
          ]
          by_id = {x.get('id'): x for x in scenarios}
          for item in additions:
              old = by_id.get(item['id'])
              if old is None:
                  scenarios.append(item)
              elif old != item:
                  raise SystemExit(f"conflicting existing eval {item['id']}")
          evals_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')

          generator_path = Path('dish/scripts/chatgpt_project_kernels.py')
          generator = generator_path.read_text()
          ids = [x['id'] for x in additions]
          match = re.search(r"REQUIRED_EVAL_IDS=\{[^\n]*\}", generator)
          if not match:
              raise SystemExit('REQUIRED_EVAL_IDS assignment not found')
          segment = match.group(0)
          missing = [repr(x) for x in ids if repr(x) not in segment]
          if missing:
              segment = segment[:-1] + ', ' + ', '.join(missing) + '}'
              generator = generator[:match.start()] + segment + generator[match.end():]
              generator_path.write_text(generator)
          PY

      - name: Reconcile and render canonical Project outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 dish/scripts/chatgpt_project_kernels.py reconcile \
            --base-manifest dish/docs/chatgpt-projects/manifest.json \
            --base-source /tmp/base-source.json \
            --source dish/docs/chatgpt-projects/source.json \
            --output /tmp/manifest.json
          mv /tmp/manifest.json dish/docs/chatgpt-projects/manifest.json
          python3 dish/scripts/chatgpt_project_kernels.py render

      - name: Validate focused authoring result
        shell: bash
        run: |
          set -euo pipefail
          python3 dish/scripts/chatgpt_project_kernels.py check
          git diff --check
          test -n "$(git status --porcelain)"

      - name: Remove temporary helper and publish generated branch head
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-review-bundle-fallback-authoring.yml
          git config user.name 'Dish Agent'
          git config user.email 'dish-agent@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete Review bundle fallback policy generation'
          git push origin HEAD:agent/review-bundle-fallback
