name: Temporary Task 1 governed verification

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/review-bundle-fallback'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Materialize corrected helper-free candidate commit
        id: candidate
        shell: bash
        env:
          PRIOR_SEMANTIC_CANDIDATE: fbacd19e27cd42d8f4903adf6ad91f95bf41162f
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-task1-governed-verification.yml
          python3 <<'PY'
          from pathlib import Path
          path = Path('dish/tests/test_chatgpt_project_kernels.py')
          text = path.read_text()
          old = "['d96ab5f0588d','708fb9a9a9bc','39ff3abc502e','857d88788c12','23365034a0f1','9575ccfd79c8','28dcb04decc8','9bb70124ca21','694190185f60','712e3b16aa05','d048682742d6','54041bbbc8d8','86b8011172ee','219f34402511','9bf227f53f0a','5d24af30193a']"
          new = "['d96ab5f0588d','708fb9a9a9bc','39ff3abc502e','857d88788c12','23365034a0f1','9575ccfd79c8','28dcb04decc8','9bb70124ca21','694190185f60','712e3b16aa05','d048682742d6','54041bbbc8d8','86b8011172ee','219f34402511','9bf227f53f0a','5d24af30193a','bfaeef68aed9']"
          if text.count(old) != 1:
              raise SystemExit('expected required-version inventory fixture not found exactly once')
          text = text.replace(old, new, 1)
          old_count = "assert set(versions)==expected and len(versions)==17"
          new_count = "assert set(versions)==expected and len(versions)==18"
          if text.count(old_count) != 1:
              raise SystemExit('expected required-version count assertion not found exactly once')
          path.write_text(text.replace(old_count, new_count, 1))
          PY
          git config user.name 'Dish Agent'
          git config user.email 'dish-agent@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Project required-version inventory expectation'
          mapfile -t delta < <(git diff --name-only "$PRIOR_SEMANTIC_CANDIDATE"...HEAD)
          test "${#delta[@]}" -eq 1
          test "${delta[0]}" = 'dish/tests/test_chatgpt_project_kernels.py'
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate Project generator and selector map
        shell: bash
        run: |
          set -euo pipefail
          python3 dish/scripts/chatgpt_project_kernels.py check
          python3 dish/scripts/dish-test-plan --validate
          git diff --check be37fbbb3dbd830b37cd1c5221ce75aa8a629add...HEAD

      - name: Build governed changed-path plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-artifacts/task1
          cd dish
          python3 scripts/dish-test-plan \
            --base be37fbbb3dbd830b37cd1c5221ce75aa8a629add \
            --json > ../.test-artifacts/task1/plan.json
          cat ../.test-artifacts/task1/plan.json

      - name: Resolve canonical Python version
        id: python-bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dependency_bundle.py expected \
            --repo-root "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Setup canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.python-bundle.outputs.python_version }}

      - name: Recreate canonical Python environments
        uses: ./.github/actions/setup-python-bundle
        with:
          github-token: ${{ github.token }}

      - name: Run every planner-required command
        shell: bash
        run: |
          set -euo pipefail
          cd dish
          python3 <<'PY'
          import json
          import subprocess
          from pathlib import Path
          plan = json.loads(Path('../.test-artifacts/task1/plan.json').read_text())
          for command in plan['commands']:
              print(f'+ {command}', flush=True)
              subprocess.run(command, shell=True, check=True)
          PY

      - name: Publish exact final branch head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/review-bundle-fallback

      - name: Record durable Implementation evidence on PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_HEAD: ${{ steps.candidate.outputs.head }}
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/evidence.md
          import json
          import os
          from pathlib import Path
          p = json.loads(Path('.test-artifacts/task1/plan.json').read_text())
          print('<!-- dish-implementation-evidence:v1 -->')
          print('IMPLEMENTATION EVIDENCE — Task 1217591613117587')
          print(f"Exact head: `{os.environ['FINAL_HEAD']}`")
          print('')
          print('PASS: `python3 dish/scripts/chatgpt_project_kernels.py check`')
          print('PASS: `python3 dish/scripts/dish-test-plan --validate`')
          print('PASS: `git diff --check be37fbbb3dbd830b37cd1c5221ce75aa8a629add...HEAD`')
          print('')
          print('Governed changed-path plan:')
          print('- Classes: ' + ', '.join(p['classes']))
          print('- Traits: ' + (', '.join(p['traits']) or 'none'))
          print('- Commands:')
          for command in p['commands']:
              print(f'  - PASS: `{command}`')
          print('')
          print('The temporary verification workflow removed itself before these checks; the tested tree is the exact helper-free final head.')
          print('')
          print('— Dish Agent: Implementation | GitHub Actions | task 1217591613117587')
          PY
          gh pr comment 164 --repo "$GITHUB_REPOSITORY" --body-file /tmp/evidence.md
