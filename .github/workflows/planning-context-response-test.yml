name: Temporary Planning MCP presentation tests

on:
  pull_request:
    branches: [main]
    paths:
      - "dish/dish_service/mcp_server.py"
      - "dish/tests/test_planning_context_mcp.py"
      - ".github/workflows/planning-context-response-test.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r dish/requirements-test.txt
      - name: Compile and lint edited Python files
        run: |
          python -m compileall -q dish/dish_service/mcp_server.py dish/tests/test_planning_context_mcp.py
          python -m ruff check --select E4,E7,E9,F dish/dish_service/mcp_server.py dish/tests/test_planning_context_mcp.py
      - name: Run focused MCP regression tests
        run: |
          cd dish
          python -m pytest -q tests/test_planning_context_mcp.py tests/test_planning_context.py tests/postgresql/test_mcp_app_adapter.py
