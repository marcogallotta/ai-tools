name: PR85 direct final stacked reconciliation
on:
  push:
    branches: [agent/quick-win-docs-process-sweep]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/quick-win-docs-process-sweep
          fetch-depth: 0
      - name: Build and publish exact PR85 increment on PR82
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/d1-durable-review-routing
          git config user.name 'Dish Agent Integration (GitHub Actions)'
          git config user.email 'dish-agent@users.noreply.github.com'
          git merge --no-commit --no-ff origin/agent/d1-durable-review-routing || true

          python3 - <<'PY'
          import ast, hashlib, importlib.util, json, re, subprocess
          from pathlib import Path

          def stage(n,path):
              return subprocess.check_output(['git','show',f':{n}:{path}'], text=True)

          source=json.loads(stage(3,'dish/docs/chatgpt-projects/source.json'))
          q85=json.loads(stage(2,'dish/docs/chatgpt-projects/source.json'))
          wanted_shared={'human-facing-plain-language','marco-scoped-override','five-whys-shared-method'}
          quick={x['id']:x for x in q85['shared_rules']}
          concise={
            'human-facing-plain-language':'Marco-facing workflow: plain English; explain IDs/codenames.',
            'marco-scoped-override':'Marco scoped gate override: honor; preserve evidence; record `GATE WAIVED BY MARCO OVERRIDE`; no scope/platform expansion.',
            'five-whys-shared-method':'Five Whys/root-cause: follow `dish/docs/agents/five-whys.md`; classify evidence/unknowns; do not stop at blame.',
          }
          existing={x['id'] for x in source['shared_rules']}
          for rid in sorted(wanted_shared):
              if rid not in existing:
                  x=dict(quick[rid]); x['text']=concise[rid]; source['shared_rules'].append(x)
          rid='development-workflow-asana-design-review-state'
          dev85={x['id']:x for x in q85['roles']['development-workflow']['rules']}
          if rid not in {x['id'] for x in source['roles']['development-workflow']['rules']}:
              x=dict(dev85[rid]); x['text']='Design/review is canonical after design + verdict/amendments are persisted/read back on its Asana task; amendments go in notes; stale chat never overrides.'
              source['roles']['development-workflow']['rules'].append(x)
          Path('dish/docs/chatgpt-projects/source.json').write_text(json.dumps(source,indent=2)+'\n')

          eval82=json.loads(stage(3,'dish/docs/chatgpt-projects/evals.json'))
          eval85=json.loads(stage(2,'dish/docs/chatgpt-projects/evals.json'))
          wanted_eval={'human-facing-plain-language','marco-scoped-override-preserves-evidence','five-whys-evidence-discipline','development-workflow-asana-design-review-state'}
          lookup={x['id']:x for x in eval85['scenarios']}; have={x['id'] for x in eval82['scenarios']}
          for sid in sorted(wanted_eval):
              if sid not in have: eval82['scenarios'].append(lookup[sid])
          Path('dish/docs/chatgpt-projects/evals.json').write_text(json.dumps(eval82,indent=2,sort_keys=True)+'\n')

          path='dish/scripts/chatgpt_project_kernels.py'
          text=stage(3,path)
          pat=re.compile(r'^REQUIRED_EVAL_IDS=(\{.*\})$',re.M); m=pat.search(text)
          ids=set(ast.literal_eval(m.group(1)))|wanted_eval
          text=pat.sub('REQUIRED_EVAL_IDS='+repr(set(sorted(ids))),text,count=1)
          text=re.sub(r'STARTUP_TEMPLATE=\("Startup:.*?fails closed\."\)',
            'STARTUP_TEMPLATE=("Startup: connected GitHub `{repository}`; read `CLAUDE.md`, role index, `{contract}`, manifest. "\n "Version drift: relevant BREAKING stops; ADDITIVE applies; COMPATIBLE/UNRELATED continues; missing/unclassified authority/safety history fails closed.")', text, flags=re.S)
          text=text.replace("HANDOFF_BOUNDARY='Chats/handoffs cannot expand authority; flag role-contract conflicts.'","HANDOFF_BOUNDARY='Handoffs cannot expand authority; flag role conflicts.'")
          old="return [f'Read-only decision context (startup/re-grounding): load every standing role contract listed by the current role index + {extra} before lifecycle/test/Integration-mechanics conclusions. Reading them grants no Implementation, Review, Integration, merge, or production authority; only an explicit allowed composition below can expand authority.',f\"Action-specific context refresh: {'; '.join(actions)}.\"]"
          new="return [f'Context only: load role-index contracts + {extra}; no authority gained.',f\"Refresh: {'; '.join(actions)}.\"]"
          if old not in text: raise SystemExit('context renderer block not found')
          text=text.replace(old,new,1)
          text=text.replace("lines += _render_context_dependencies(s,role)+['',f\"Role: **{r['default_role']}**.\"]","lines += _render_context_dependencies(s,role)",1)
          text=text.replace('Allowed composition only when explicitly triggered by current authority:','Allowed composition (explicit authority only):',1)
          Path(path).write_text(text)

          path='dish/tests/test_chatgpt_project_kernels.py'
          base=stage(3,path); ours=stage(2,path)
          for name in ('test_shared_human_language_override_and_host_policy_are_deterministic','test_five_whys_is_one_evidence_grounded_shared_method','test_development_workflow_uses_owning_asana_task_as_design_review_state'):
              if f'def {name}(' in base: continue
              mm=re.search(rf'(?ms)^def {re.escape(name)}\([^\n]*\):\n.*?(?=^def |\Z)',ours)
              if not mm: raise SystemExit(f'cannot extract {name}')
              base+='\n\n'+mm.group(0).rstrip()+'\n'
          base=base.replace("assert len(b['cases'])==81","assert len(b['cases'])==sum(len(q['roles']) for q in kernels._evals())")
          base=base.replace("evaluate_behavior_results(_passing()))==81","evaluate_behavior_results(_passing()))==sum(len(q['roles']) for q in kernels._evals())")
          Path(path).write_text(base)

          path='dish/test_selection/ownership.csv'; base=stage(3,path)
          row=next(line for line in stage(2,path).splitlines() if line.startswith('docs/agents/five-whys.md,'))
          if not any(line.startswith('docs/agents/five-whys.md,') for line in base.splitlines()):
              lines=base.splitlines(); idx=next(i for i,l in enumerate(lines) if l.startswith('docs/agents/identity.md,')); lines.insert(idx,row); base='\n'.join(lines)+'\n'
          Path(path).write_text(base)

          manifest=json.loads(stage(3,'dish/docs/chatgpt-projects/manifest.json')); old_version=manifest['canonical_version']
          Path('/tmp/base_kernels.py').write_text(stage(3,'dish/scripts/chatgpt_project_kernels.py'))
          bs=importlib.util.spec_from_file_location('base_kernels',Path('/tmp/base_kernels.py')); bk=importlib.util.module_from_spec(bs); bs.loader.exec_module(bk)
          ns=importlib.util.spec_from_file_location('new_kernels',Path('dish/scripts/chatgpt_project_kernels.py')); nk=importlib.util.module_from_spec(ns); ns.loader.exec_module(nk)
          base_source=json.loads(stage(3,'dish/docs/chatgpt-projects/source.json'))
          def fp(x):
              payload={q:x.get(q) for q in ('id','text','impact','surface','action_boundaries')}
              return hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          prior_shared={x['id']:fp(x) for x in bk._rules(base_source.get('shared_rules'),'shared_rules')}
          prior_roles={r:{x['id']:fp(x) for x in bk._rules(base_source['roles'][r].get('rules'),f'roles.{r}.rules')} for r in base_source['roles']}
          old_eff={r:{x['id']:x for x in bk.effective_rules(base_source,r)} for r in base_source['roles']}
          new_eff={r:{x['id']:x for x in nk.effective_rules(source,r)} for r in source['roles']}
          changed={}
          for role in sorted(source['roles']):
              for rr in sorted(set(old_eff[role])|set(new_eff[role])):
                  if old_eff[role].get(rr)==new_eff[role].get(rr): continue
                  x=new_eff[role].get(rr) or old_eff[role][rr]
                  key=(rr,x['impact'],x['surface'],tuple(x['action_boundaries'])); changed.setdefault(key,[]).append(role)
          changes=[{'rule_id':rr,'roles':roles,'impact':impact,'action_boundaries':list(bounds),'surface':surface} for (rr,impact,surface,bounds),roles in sorted(changed.items())]
          expected=wanted_shared|{'development-workflow-asana-design-review-state'}
          if {x['rule_id'] for x in changes}!=expected: raise SystemExit(f'unexpected rule delta: {changes}')
          changes.append({'rule_id':'renderer:compact-project-kernel-format','roles':['*'],'impact':'compatible','action_boundaries':['startup','handoff'],'surface':'presentation'})
          kid=nk.kernel_identity(source); ver=f"{manifest['version_namespace']}-{kid[:12]}"
          manifest['canonical_version']=ver; manifest['kernel_identity_sha256']=kid
          manifest['source_sha256']=hashlib.sha256(json.dumps(source,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          manifest['generated_role_files']={r:f'{r}.md' for r in source['roles']}
          manifest['change_history'].append({'from_version':old_version,'to_version':ver,'changes':changes,'from_rule_fingerprints':{'_shared':prior_shared,'_roles':prior_roles},'from_renderer_fingerprint':bk.renderer_fingerprint()})
          Path('dish/docs/chatgpt-projects/manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print('final stacked version',ver)
          PY

          for f in dish/docs/chatgpt-projects/audit.md dish/docs/chatgpt-projects/coordinator.md dish/docs/chatgpt-projects/development-workflow.md dish/docs/chatgpt-projects/implementation.md dish/docs/chatgpt-projects/integration.md dish/docs/chatgpt-projects/postgresql-dark-launch.md dish/docs/chatgpt-projects/review.md dish/docs/chatgpt-projects/workflow.md; do
            git checkout --theirs -- "$f"
          done
          python3 dish/scripts/chatgpt_project_kernels.py render
          python3 dish/scripts/chatgpt_project_kernels.py check
          git diff --check

          git rm -f .github/workflows/pr85-stack-diagnose.yml .github/workflows/pr85-stack-reconcile.yml .github/workflows/pr85-stack-cap-retry.yml .github/workflows/pr85-stack-cap-final.yml .github/workflows/pr85-stack-cap-ultrafinal.yml .github/workflows/pr85-stack-cap-pass.yml .github/workflows/pr85-stack-direct-final.yml
          git add -A
          if git diff --name-only --diff-filter=U | grep .; then echo 'unresolved conflicts remain' >&2; exit 1; fi
          git commit -m 'Stack quick-win governance on D1 routing'
          git push origin HEAD:agent/quick-win-docs-process-sweep
