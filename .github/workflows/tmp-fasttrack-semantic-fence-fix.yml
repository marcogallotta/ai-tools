name: Temporary FastTrack clean-tree validation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/review-bundle-fasttrack-r3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Gate exact validation launch
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == "Launch clean FastTrack fence validation" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve canonical Python version
        if: steps.gate.outputs.run == 'true'
        id: python-bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dependency_bundle.py expected \
            --repo-root "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Setup canonical Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.python-bundle.outputs.python_version }}

      - name: Recreate canonical Python environments
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-python-bundle
        with:
          github-token: ${{ github.token }}

      - name: Validate exact clean helper-free tree
        if: steps.gate.outputs.run == 'true'
        id: clean
        shell: bash
        env:
          BASE_SHA: ae0c7366429426eb8df02969adf8157b33a61a75
        run: |
          set -euo pipefail
          rm -rf .ci/dependency-bundle .test-artifacts/dependency-bundle
          rm .github/workflows/tmp-fasttrack-semantic-fence-fix.yml
          rm scripts/tmp-fasttrack-semantic-fence-fix.sh
          git config user.name 'Dish Agent'
          git config user.email 'dish-agent@users.noreply.github.com'
          git add -A
          git commit -m 'Prospective clean FastTrack fence validation tree'
          tested_tree="$(git rev-parse HEAD^{tree})"
          echo "tested_tree=$tested_tree" >> "$GITHUB_OUTPUT"

          python3 dish/scripts/chatgpt_project_kernels.py check
          python3 dish/scripts/dish-test-plan --validate
          git diff --check "$BASE_SHA"...HEAD
          cd dish
          .venv/bin/python -m pytest -q tests/test_fast_track_overlay.py tests/test_review_bundle_consistency.py tests/test_chatgpt_project_kernels.py
          python3 scripts/dish-test-plan --base "$BASE_SHA" --json > ../.test-artifacts/fasttrack-fence-clean-plan.json
          python3 <<'PY'
          import json, subprocess
          from pathlib import Path
          plan=json.loads(Path('../.test-artifacts/fasttrack-fence-clean-plan.json').read_text())
          print(json.dumps(plan,indent=2,sort_keys=True))
          for command in plan['commands']:
              print(f'+ {command}',flush=True)
              subprocess.run(command,shell=True,check=True)
          PY

      - name: Record clean-tree validation evidence
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_TREE: ${{ steps.clean.outputs.tested_tree }}
        run: |
          set -euo pipefail
          gh pr comment 169 --repo "$GITHUB_REPOSITORY" --body "CLEAN-TREE VALIDATION PASS — exact helper-free FastTrack semantic-fence tree: \`$TESTED_TREE\`. Canonical Project check, focused FastTrack + Task 1 Review-bundle + kernel regressions, selector validation, diff check, and every governed planner-selected command all passed on this exact tree. — Dish Agent: Implementation | ChatGPT"
