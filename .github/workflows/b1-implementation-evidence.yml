name: B1 final implementation evidence

on:
  push:
    branches:
      - agent/b1-selector-correctness
    paths:
      - '.github/workflows/b1-implementation-evidence.yml'

permissions:
  contents: read

env:
  CANDIDATE_SHA: 9eb8945b575b21794dc77ba388fb59fafc38d3b7
  CANDIDATE_TREE: b8d3a3db13d45bb6a4a819247c4be20132991e99
  BASE_SHA: 2658fbba766ab413bedef7ea751ea3e9a59d3f4d

jobs:
  evidence:
    if: contains(github.event.head_commit.message, '[b1-final-evidence]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"

      - name: Resolve canonical Python version
        id: py
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dependency_bundle.py expected --repo-root "$GITHUB_WORKSPACE" --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.py.outputs.python_version }}

      - name: Recreate canonical Python environments
        uses: ./.github/actions/setup-python-bundle
        with:
          github-token: ${{ github.token }}
          include-flake: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Provision governed PGlite npm dependencies
        shell: bash
        run: npm ci --prefix dish/tests/postgresql/pglite

      - name: Start isolated native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          container="b1-final-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --rm --name "$container" \
            -e POSTGRES_DB=dish_ai_tools_ci_test \
            -e POSTGRES_USER=ai_tools_ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -p 5432:5432 postgres:17.10 >/dev/null
          echo "B1_POSTGRES_CONTAINER=$container" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if docker exec "$container" pg_isready -U ai_tools_ci -d dish_ai_tools_ci_test >/dev/null 2>&1; then
              echo 'DISH_TEST_POSTGRESQL_DSN=postgresql+psycopg://ai_tools_ci:ci-only-password@127.0.0.1:5432/dish_ai_tools_ci_test' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs "$container" >&2 || true
          exit 1

      - name: Run focused repository selector regressions
        shell: bash
        run: |
          set -euo pipefail
          dish/.venv/bin/python -m pytest -q \
            ci/tests/test_integration_certification_plan.py \
            ci/tests/test_pr_certification.py \
            ci/tests/test_integration_certification.py

      - name: Run focused Dish selector regressions
        shell: bash
        working-directory: dish
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q \
            tests/test_dish_test_map_validation.py \
            tests/test_dish_test_plan.py \
            tests/postgresql/test_native_postgresql_certification_lane.py \
            tests/test_flake_policy.py

      - name: Validate ownership map and build governed plan
        shell: bash
        working-directory: dish
        run: |
          set -euo pipefail
          mkdir -p ../.test-artifacts/b1-final
          .venv/bin/python scripts/dish-test-plan --validate | tee ../.test-artifacts/b1-final/validation.log
          .venv/bin/python scripts/dish-test-plan --base "$BASE_SHA" --json \
            > ../.test-artifacts/b1-final/dish-plan.json
          cat ../.test-artifacts/b1-final/dish-plan.json

      - name: Run planner smoke lane
        shell: bash
        working-directory: dish
        run: .venv/bin/python -m pytest --smoke

      - name: Run planner SQLite database-boundary lane
        shell: bash
        working-directory: dish
        run: .venv/bin/python -m pytest --database-boundary

      - name: Run planner PGlite lane
        id: pglite
        continue-on-error: true
        shell: bash
        working-directory: dish
        run: |
          set -o pipefail
          .venv/bin/python scripts/dish-pg-pglite \
            --output ../.test-artifacts/b1-final/pglite-report.json \
            2>&1 | tee ../.test-artifacts/b1-final/pglite.log

      - name: Verify PGlite result is pass or the exact known current-main baseline defect
        shell: bash
        working-directory: dish
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('../.test-artifacts/b1-final/pglite-report.json').read_text())
          known = {
              'tests/postgresql/pglite/test_0022_candidate_state_manifest.py::test_0022_database_rejects_approval_without_manifest_binding',
              'tests/postgresql/pglite/test_validation_failure_authority.py::test_pglite_validation_failure_preserves_closed_reservation',
          }
          if report['passed']:
              print('PGlite passed; previously known baseline defect is resolved on this candidate.')
          else:
              failed = {
                  node['nodeid']
                  for lane in (report['primary'], report['quarantine'])
                  for node in lane['nodes']
                  if node['assertion_failures']
              }
              assert failed == known, (failed, known)
              assert report['failure_classification']['assertion_failures'] == 2
              assert report['failure_classification']['infrastructure_failures'] == 0
              print('PGlite reproduced only Asana 1217506975330014 known baseline failures.')
          PY

      - name: Run planner native PostgreSQL certification with canonical waivers
        shell: bash
        working-directory: dish
        run: |
          set -euo pipefail
          .venv/bin/python scripts/dish-pg-native-certification \
            --output ../.test-artifacts/b1-final/native-postgresql-report.json \
            --waive-skip "tests/postgresql/native/test_production_shaped_runtime.py::test_section4_service_database_disconnect_rolls_back_then_recovers_once=no runner wires DISH_SECTION1_COMPOSE_JSON to the shared TEST PostgreSQL target; revisit before setting external_effects_enabled=true" \
            --waive-skip "tests/postgresql/native/test_process_failure_command.py::test_command_process_disconnect_before_commit_fails_closed_and_recovers=no runner wires DISH_SECTION1_COMPOSE_JSON under bare native certification; already covered via dish-pg-process-failure" \
            --waive-skip "tests/postgresql/native/test_process_failure_disconnect.py::test_projection_worker_fails_clearly_across_postgresql_disconnect=no runner wires DISH_SECTION1_COMPOSE_JSON under bare native certification; already covered via dish-pg-process-failure" \
            --waive-skip "tests/postgresql/native/test_process_failure_disconnect.py::test_reconciliation_worker_writes_nothing_while_postgresql_is_down=no runner wires DISH_SECTION1_COMPOSE_JSON under bare native certification; already covered via dish-pg-process-failure" \
            2>&1 | tee ../.test-artifacts/b1-final/native-postgresql.log

      - name: Build frontend prerequisite for ordinary full suite
        shell: bash
        working-directory: dish
        run: npm --prefix frontend run build

      - name: Run planner ordinary full suite
        shell: bash
        working-directory: dish
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q 2>&1 | tee ../.test-artifacts/b1-final/ordinary-full.log

      - name: Verify candidate diff hygiene
        shell: bash
        run: git diff --check "$BASE_SHA" "$CANDIDATE_SHA"

      - name: Record final evidence identity
        if: always()
        shell: bash
        run: |
          mkdir -p .test-artifacts/b1-final
          cat > .test-artifacts/b1-final/identity.txt <<EOF
          candidate_sha=$CANDIDATE_SHA
          candidate_tree=$CANDIDATE_TREE
          base_sha=$BASE_SHA
          pglite_step_outcome=${{ steps.pglite.outcome }}
          pglite_baseline_task=1217506975330014
          EOF

      - name: Upload final implementation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b1-final-implementation-evidence-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}
          path: .test-artifacts/b1-final
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Stop isolated PostgreSQL
        if: always()
        shell: bash
        run: |
          if [[ -n "${B1_POSTGRES_CONTAINER:-}" ]]; then
            docker rm -f "$B1_POSTGRES_CONTAINER" >/dev/null 2>&1 || true
          fi
