name: B1 remaining implementation evidence

on:
  push:
    branches:
      - agent/b1-selector-correctness
    paths:
      - '.github/workflows/b1-implementation-evidence.yml'

permissions:
  contents: write

env:
  SEMANTIC_SHA: 64697c6efc7f39665918b2695d1a6a076a9e781a

jobs:
  remaining:
    if: contains(github.event.head_commit.message, '[b1-remaining-evidence]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SEMANTIC_SHA }}
          fetch-depth: 0

      - name: Verify exact semantic checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SEMANTIC_SHA"
          test "$(git rev-parse HEAD^{tree})" = '2c595f8c106a978850f44d753d8ddda677f3e3de'

      - name: Resolve canonical Python version
        id: py
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dependency_bundle.py expected --repo-root "$GITHUB_WORKSPACE" --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.py.outputs.python_version }}

      - name: Recreate canonical Python environments
        uses: ./.github/actions/setup-python-bundle
        with:
          github-token: ${{ github.token }}
          include-flake: false

      - name: Start isolated native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          container="b1-remaining-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --rm --name "$container" \
            -e POSTGRES_DB=dish_ai_tools_ci_test \
            -e POSTGRES_USER=ai_tools_ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -p 5432:5432 postgres:17.10 >/dev/null
          echo "B1_POSTGRES_CONTAINER=$container" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if docker exec "$container" pg_isready -U ai_tools_ci -d dish_ai_tools_ci_test >/dev/null 2>&1; then
              echo 'DISH_TEST_POSTGRESQL_DSN=postgresql+psycopg://ai_tools_ci:ci-only-password@127.0.0.1:5432/dish_ai_tools_ci_test' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs "$container" >&2 || true
          exit 1

      - name: Run planner-required native PostgreSQL certification
        id: native
        continue-on-error: true
        shell: bash
        working-directory: dish
        run: |
          set -o pipefail
          mkdir -p ../.test-artifacts/b1-remaining
          .venv/bin/python scripts/dish-pg-native-certification \
            --output ../.test-artifacts/b1-remaining/native-postgresql-report.json \
            2>&1 | tee ../.test-artifacts/b1-remaining/native-postgresql.log

      - name: Run planner-required ordinary full suite
        id: full
        continue-on-error: true
        shell: bash
        working-directory: dish
        run: |
          set -o pipefail
          .venv/bin/python -m pytest 2>&1 | tee ../.test-artifacts/b1-remaining/ordinary-full.log

      - name: Record result summary
        if: always()
        shell: bash
        run: |
          mkdir -p .test-artifacts/b1-remaining
          cat > .test-artifacts/b1-remaining/summary.txt <<EOF
          semantic_sha=$SEMANTIC_SHA
          native_outcome=${{ steps.native.outcome }}
          full_outcome=${{ steps.full.outcome }}
          pglite_baseline_task=1217506975330014
          pglite_known_failures=2
          EOF
          cat .test-artifacts/b1-remaining/summary.txt

      - name: Upload remaining evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b1-remaining-evidence-${{ env.SEMANTIC_SHA }}-${{ github.run_id }}
          path: .test-artifacts/b1-remaining
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Stop isolated PostgreSQL
        if: always()
        shell: bash
        run: |
          if [[ -n "${B1_POSTGRES_CONTAINER:-}" ]]; then
            docker rm -f "$B1_POSTGRES_CONTAINER" >/dev/null 2>&1 || true
          fi

      - name: Self-remove evidence transport
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/b1-selector-correctness
          git checkout -B agent/b1-selector-correctness origin/agent/b1-selector-correctness
          rm -f .github/workflows/b1-implementation-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove B1 evidence transport'
          git push origin HEAD:agent/b1-selector-correctness

      - name: Fail if remaining evidence failed
        if: always()
        shell: bash
        run: |
          test '${{ steps.native.outcome }}' = 'success'
          test '${{ steps.full.outcome }}' = 'success'
