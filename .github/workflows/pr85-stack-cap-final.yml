name: PR85 stacked reconciliation final cap
on:
  push:
    branches: [agent/quick-win-docs-process-sweep]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/quick-win-docs-process-sweep
          fetch-depth: 0
      - name: Run final compact stacked reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/pr85-stack-cap-retry.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(src) if l.strip()=='run: |')+1
          lines=[]
          for line in src[start:]:
              if line.startswith('          '): lines.append(line[10:])
              elif not line.strip(): lines.append('')
              else: break
          script='\n'.join(lines)+'\n'
          script=script.replace("'human-facing-plain-language':'Marco-facing workflow text: plain English; explain IDs/codenames.'","'human-facing-plain-language':'Marco-facing workflow: plain English; explain IDs/codenames.'")
          script=script.replace("'marco-scoped-override':'Honor Marco’s scoped gate override; preserve evidence; record `GATE WAIVED BY MARCO OVERRIDE`; never widen scope or override platform constraints.'","'marco-scoped-override':'Marco scoped gate override: honor it; preserve evidence; record `GATE WAIVED BY MARCO OVERRIDE`; never widen scope or override platform constraints.'")
          script=script.replace("'five-whys-shared-method':'Five Whys/root-cause: follow `dish/docs/agents/five-whys.md`; classify evidence/unknowns; no fixed-five or blame stop.'","'five-whys-shared-method':'Five Whys/root-cause: follow `dish/docs/agents/five-whys.md`; classify evidence/unknowns; no blame stop.'")
          script=script.replace("x['text']='Design/review is canonical after current design + verdict/amendments are persisted/read back on its Asana task; fold accepted amendments into notes; stale chat never overrides task state.'","x['text']='Design/review is canonical after current design + verdict/amendments are persisted/read back on its Asana task; accepted amendments go in notes; stale chat never overrides.'")
          old='STARTUP_TEMPLATE=("Startup: connected GitHub `{repository}`; read `CLAUDE.md`, role index, `{contract}`, manifest. "\\n "Fold version drift for role/action: relevant BREAKING stops; ADDITIVE applies; COMPATIBLE/UNRELATED continues; "\\n "missing/unclassified authority/safety history fails closed.")'
          new='STARTUP_TEMPLATE=("Startup: connected GitHub `{repository}`; read `CLAUDE.md`, role index, `{contract}`, manifest. "\\n "Version drift: relevant BREAKING stops; ADDITIVE applies; COMPATIBLE/UNRELATED continues; missing/unclassified authority/safety history fails closed.")'
          script=script.replace(old,new)
          script=script.replace("new=\"return [f'Context only: load role-index contracts + {extra}; reading adds no Implementation/Review/Integration/merge/production authority.',f\\\"Refresh by action: {'; '.join(actions)}.\\\"]\"","new=\"return [f'Context only: load role-index contracts + {extra}; no authority gained.',f\\\"Refresh: {'; '.join(actions)}.\\\"]\"")
          script=script.replace('.github/workflows/pr85-stack-cap-retry.yml', '.github/workflows/pr85-stack-cap-retry.yml .github/workflows/pr85-stack-cap-final.yml', 1)
          Path('/tmp/pr85-final.sh').write_text(script)
          PY
          bash /tmp/pr85-final.sh
