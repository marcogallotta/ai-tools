name: PR85 stacked reconciliation under cap
on:
  push:
    branches: [agent/quick-win-docs-process-sweep]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/quick-win-docs-process-sweep
          fetch-depth: 0
      - name: Run final stacked reconciliation under cap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/pr85-stack-cap-final.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(src) if l.strip()=='run: |')+1
          lines=[]
          for line in src[start:]:
              if line.startswith('          '): lines.append(line[10:])
              elif not line.strip(): lines.append('')
              else: break
          script='\n'.join(lines)+'\n'
          inject=r'''python3 - <<'PY2'
          from pathlib import Path
          p=Path('/tmp/pr85-final.sh'); s=p.read_text()
          s=s.replace('Marco scoped gate override: honor it; preserve evidence; record `GATE WAIVED BY MARCO OVERRIDE`; never widen scope or override platform constraints.','Marco scoped gate override: honor; preserve evidence; record `GATE WAIVED BY MARCO OVERRIDE`; no scope/platform expansion.')
          s=s.replace('Five Whys/root-cause: follow `dish/docs/agents/five-whys.md`; classify evidence/unknowns; no blame stop.','Five Whys/root-cause: follow `dish/docs/agents/five-whys.md`; classify evidence/unknowns; do not stop at blame.')
          s=s.replace('Design/review is canonical after current design + verdict/amendments are persisted/read back on its Asana task; accepted amendments go in notes; stale chat never overrides.','Design/review is canonical after design + verdict/amendments are persisted/read back on its Asana task; amendments go in notes; stale chat never overrides.')
          s=s.replace('.github/workflows/pr85-stack-cap-final.yml', '.github/workflows/pr85-stack-cap-final.yml .github/workflows/pr85-stack-cap-ultrafinal.yml', 1)
          p.write_text(s)
          PY2
          '''
          script=script.replace('bash /tmp/pr85-final.sh',inject+'bash /tmp/pr85-final.sh',1)
          Path('/tmp/pr85-ultra.sh').write_text(script)
          PY
          bash /tmp/pr85-ultra.sh
