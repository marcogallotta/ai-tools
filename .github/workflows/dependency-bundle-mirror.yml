name: Dependency bundle artifact mirror

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing dependency-bundle Release tag to mirror (must match exact main source)
        required: false
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  mirror:
    name: Mirror authoritative dependency bundle
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'dependency-bundle-')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact locator source
        if: github.event_name != 'release'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve expected bundle from exact source
        if: github.event_name != 'release'
        id: expected
        shell: bash
        run: python3 scripts/dependency_bundle.py expected --repo-root . --github-output "$GITHUB_OUTPUT"

      - name: Resolve immutable asset names
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          EXPECTED_TAG: ${{ steps.expected.outputs.release_tag }}
          EXPECTED_BUNDLE_ID: ${{ steps.expected.outputs.bundle_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            release_tag="$RELEASE_EVENT_TAG"
            bundle_id="${release_tag#dependency-bundle-}"
            locator_sha=""
          else
            release_tag="$EXPECTED_TAG"
            bundle_id="$EXPECTED_BUNDLE_ID"
            locator_sha="$GITHUB_SHA"
            if [[ -n "$REQUESTED_TAG" && "$REQUESTED_TAG" != "$release_tag" ]]; then
              echo "requested tag does not match exact-source expected bundle: $REQUESTED_TAG != $release_tag" >&2
              exit 2
            fi
          fi
          test -n "$bundle_id"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$bundle_id" >> "$GITHUB_OUTPUT"
          echo "locator_sha=$locator_sha" >> "$GITHUB_OUTPUT"
          echo "archive_name=$bundle_id.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$bundle_id.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          echo "manifest_name=$bundle_id.manifest.json" >> "$GITHUB_OUTPUT"

      - name: Publish pending exact-SHA locator
        if: github.event_name != 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOCATOR_SHA: ${{ steps.meta.outputs.locator_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$LOCATOR_SHA" \
            -f state=pending \
            -f context='Dish / dependency bundle' \
            -f description='Exact dependency bundle mirror in progress' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Download Release authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          ARCHIVE_NAME: ${{ steps.meta.outputs.archive_name }}
          CHECKSUM_NAME: ${{ steps.meta.outputs.checksum_name }}
          MANIFEST_NAME: ${{ steps.meta.outputs.manifest_name }}
        run: |
          set -euo pipefail
          mkdir -p dependency-bundle-mirror
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dependency-bundle-mirror \
            --pattern "$ARCHIVE_NAME" \
            --pattern "$CHECKSUM_NAME" \
            --pattern "$MANIFEST_NAME"
          test -f "dependency-bundle-mirror/$ARCHIVE_NAME"
          test -f "dependency-bundle-mirror/$CHECKSUM_NAME"
          test -f "dependency-bundle-mirror/$MANIFEST_NAME"

      - name: Verify Release checksum and manifest identity
        shell: bash
        env:
          BUNDLE_ID: ${{ steps.meta.outputs.bundle_id }}
          ARCHIVE_NAME: ${{ steps.meta.outputs.archive_name }}
          CHECKSUM_NAME: ${{ steps.meta.outputs.checksum_name }}
          MANIFEST_NAME: ${{ steps.meta.outputs.manifest_name }}
        run: |
          set -euo pipefail
          cd dependency-bundle-mirror
          sha256sum --check "$CHECKSUM_NAME"
          tar -xOzf "$ARCHIVE_NAME" bundle-manifest.json > archive-manifest.json
          cmp "$MANIFEST_NAME" archive-manifest.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["MANIFEST_NAME"]).read_text(encoding="utf-8"))
          assert manifest["bundle_id"] == os.environ["BUNDLE_ID"], manifest["bundle_id"]
          print(manifest["bundle_id"])
          PY
          rm archive-manifest.json

      - name: Upload matching Actions artifact mirror
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.bundle_id }}
          path: dependency-bundle-mirror
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Publish terminal exact-SHA locator
        if: always() && github.event_name != 'release' && steps.meta.outputs.locator_sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOCATOR_SHA: ${{ steps.meta.outputs.locator_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='Exact dependency bundle mirror failed'
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success
            description='Exact dependency bundle mirror published'
          fi
          gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$LOCATOR_SHA" \
            -f state="$state" \
            -f context='Dish / dependency bundle' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
