name: Publish exact CI fix

on:
  push:
    branches: [agent/ownership-blob-builder]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 770f25a27f4cb90d2b61817ebf1c92ac6675571a
          fetch-depth: 0
      - name: Materialize exact tested tree and publish implementation branch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/ci-fix.patch
          echo 'd603ddfc06b55b45acff6344761e906579ac17eaf5e57606e8b79c53ca64ba30  /tmp/ci-fix.patch' | sha256sum -c -
          git apply --check /tmp/ci-fix.patch
          git apply /tmp/ci-fix.patch
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path('dish/test_selection/ownership.csv')
          rows = list(csv.reader(path.open(newline='', encoding='utf-8')))
          header, body = rows[0], rows[1:]
          kept = [row for row in body if not row[0].startswith('frontend/dist/')]
          removed = len(body) - len(kept)
          if removed != 47:
              raise SystemExit(f'expected exactly 47 frontend/dist mappings, removed {removed}')
          with path.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.writer(handle, lineterminator='\n')
              writer.writerow(header)
              writer.writerows(kept)
          PY
          git diff --check
          test "$(git hash-object .github/workflows/ci.yml)" = 'be089b354a16b3e0cee1de2b361e6cbdd773cd7a'
          test "$(git hash-object .github/actions/upload-test-evidence/action.yml)" = 'd699fcd855c613cfe24f30903275d830e71f6c83'
          test "$(git hash-object ci/tests/test_ci_evidence_upload.py)" = 'a3f3628112119256e2633feab7bfe8e225c0b43a'
          test "$(git hash-object dish/frontend/tests/browser/test_admin_acceptance.py)" = '79e9543b614300b768ecd4c4233e861bcb09eecb'
          test "$(git hash-object dish/test_selection/ownership.csv)" = 'd3739001dc847fe5719ee21d50efa1b6b41ec8fb'
          test "$(git hash-object dish/test_selection/validator.py)" = '47404f4de5427e4a8d86d730bf069f03e5ee0c61'
          test "$(git hash-object dish/tests/postgresql/native/test_operation_discard_prepare_concurrency.py)" = '0325eed5646ad65796f2632c596cc4fcbeaf22ac'
          test "$(git hash-object dish/tests/test_dish_test_map_validation.py)" = '36b0d9d127190259cf37dc08f5c0c4c4f0d4da89'
          git add -A
          tree="$(git write-tree)"
          test "$tree" = 'b9bfed41f34cb90b4a19090b9330a299154489cb'
          git config user.name 'Dish Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(printf '%s\n' 'Fix current CI failures and evidence capture' | git commit-tree "$tree" -p 770f25a27f4cb90d2b61817ebf1c92ac6675571a)"
          echo "implementation_commit=$commit"
          git show --stat --oneline "$commit"
          git push origin "$commit:refs/heads/agent/clear-current-ci"
