name: Final CI fix tree builder

on:
  push:
    branches: [agent/ownership-blob-builder]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build exact tested CI fix tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          old = "            ci/tests/test_repository_bundle.py \\\n            --junitxml=.test-artifacts/python/bundles.xml \\\n"
          new = "            ci/tests/test_repository_bundle.py \\\n            ci/tests/test_ci_evidence_upload.py \\\n            --junitxml=.test-artifacts/python/bundles.xml \\\n"
          if text.count(old) != 1:
              raise SystemExit("ci.yml: bundle-contract insertion anchor mismatch")
          text = text.replace(old, new)
          if text.count("uses: actions/upload-artifact@v7") != 4:
              raise SystemExit("ci.yml: expected four direct upload actions")
          text = text.replace("uses: actions/upload-artifact@v7", "uses: ./.github/actions/upload-test-evidence")
          if text.count("          if-no-files-found: warn\n") != 4:
              raise SystemExit("ci.yml: expected four warning-only evidence settings")
          text = text.replace("          if-no-files-found: warn\n", "")
          for old_value, new_value in (
              ("POSTGRES_DB: ai_tools_ci", "POSTGRES_DB: dish_ai_tools_ci_test"),
              ("pg_isready -U ai_tools_ci -d ai_tools_ci", "pg_isready -U ai_tools_ci -d dish_ai_tools_ci_test"),
              ("postgresql+psycopg://ai_tools_ci:ci-only-password@127.0.0.1:5432/ai_tools_ci", "postgresql+psycopg://ai_tools_ci:ci-only-password@127.0.0.1:5432/dish_ai_tools_ci_test"),
          ):
              if text.count(old_value) != 1:
                  raise SystemExit(f"ci.yml: PostgreSQL anchor mismatch: {old_value}")
              text = text.replace(old_value, new_value)
          old_guard = '''          assert parsed.hostname in {"127.0.0.1", "localhost"}, parsed.hostname
          assert parsed.username == "ai_tools_ci", parsed.username
          assert parsed.path == "/ai_tools_ci", parsed.path
'''
          new_guard = '''          assert parsed.hostname in {"127.0.0.1", "localhost"}, parsed.hostname
          assert parsed.username == "ai_tools_ci", parsed.username
          database = parsed.path.removeprefix("/")
          assert database == "dish_ai_tools_ci_test", database
          assert database.startswith("dish_") and database.endswith("_test"), database
          assert "prod" not in database.lower() and "production" not in database.lower(), database
'''
          if text.count(old_guard) != 1:
              raise SystemExit("ci.yml: target guard anchor mismatch")
          ci.write_text(text.replace(old_guard, new_guard), encoding="utf-8")

          action = Path(".github/actions/upload-test-evidence/action.yml")
          action.parent.mkdir(parents=True, exist_ok=True)
          action.write_text('''name: Upload required test evidence
description: Upload CI test evidence, including hidden artifact roots, and fail closed when no evidence exists.
inputs:
  name:
    description: Artifact name.
    required: true
  path:
    description: Newline-delimited evidence paths accepted by actions/upload-artifact.
    required: true
runs:
  using: composite
  steps:
    - name: Upload evidence
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        include-hidden-files: true
        if-no-files-found: error
''', encoding="utf-8")

          ci_test = Path("ci/tests/test_ci_evidence_upload.py")
          ci_test.write_text('''from pathlib import Path


