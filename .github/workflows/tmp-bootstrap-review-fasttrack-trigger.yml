name: Temporary Review/FastTrack hosted implementation launcher

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'agent/review-bundle-fasttrack-r3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Gate exact launch commit
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" == "Launch hosted Review/FastTrack implementation" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "No-op: head subject is $subject"
          fi

      - name: Resolve canonical Python version
        if: steps.gate.outputs.run == 'true'
        id: python-bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dependency_bundle.py expected \
            --repo-root "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Setup canonical Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.python-bundle.outputs.python_version }}

      - name: Recreate canonical Python environments
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-python-bundle
        with:
          github-token: ${{ github.token }}

      - name: Task 1 — resolve Review bundle contradiction
        if: steps.gate.outputs.run == 'true'
        id: task1
        shell: bash
        env:
          BASE_SHA: a45f301611d2d950ebb4fa09130f6eb926265d65
        run: bash scripts/tmp-review-fasttrack-prep.sh && bash scripts/tmp-review-fasttrack-task1.sh

      - name: Task 2 — implement FastTrack-R3 Project overlay
        if: steps.gate.outputs.run == 'true'
        id: task2
        shell: bash
        env:
          BASE_SHA: a45f301611d2d950ebb4fa09130f6eb926265d65
        run: bash scripts/tmp-review-fasttrack-compact.sh && bash scripts/tmp-review-fasttrack-task2.sh

      - name: Build and validate exact prospective helper-free tree
        if: steps.gate.outputs.run == 'true'
        id: validated
        shell: bash
        env:
          BASE_SHA: a45f301611d2d950ebb4fa09130f6eb926265d65
          TASK2_HEAD: ${{ steps.task2.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TASK2_HEAD"
          rm -rf .ci/dependency-bundle .test-artifacts/dependency-bundle
          rm .github/workflows/tmp-review-bundle-fasttrack-r3.yml
          rm .github/workflows/tmp-bootstrap-review-fasttrack-trigger.yml
          rm .github/dish-workstream-bootstrap-review-fasttrack.txt
          rm scripts/tmp-review-fasttrack-task1.sh
          rm scripts/tmp-review-fasttrack-task2.sh
          rm scripts/tmp-review-fasttrack-compact.sh
          rm scripts/tmp-review-fasttrack-prep.sh
          git add -A
          git commit -m 'Prospective helper-free validation tree'
          tested_commit="$(git rev-parse HEAD)"
          tested_tree="$(git rev-parse HEAD^{tree})"
          echo "tested_commit=$tested_commit" >> "$GITHUB_OUTPUT"
          echo "tested_tree=$tested_tree" >> "$GITHUB_OUTPUT"
          python3 dish/scripts/chatgpt_project_kernels.py check
          python3 dish/scripts/dish-test-plan --validate
          git diff --check "$BASE_SHA"...HEAD
          mkdir -p .test-artifacts/review-fasttrack
          cd dish
          python3 scripts/dish-test-plan --base "$BASE_SHA" --json > ../.test-artifacts/review-fasttrack/plan.json
          cat ../.test-artifacts/review-fasttrack/plan.json
          python3 <<'PY'
          import json, subprocess
          from pathlib import Path
          plan=json.loads(Path('../.test-artifacts/review-fasttrack/plan.json').read_text())
          for command in plan['commands']:
              print(f'+ {command}',flush=True)
              subprocess.run(command,shell=True,check=True)
          PY

      - name: Publish semantic Task 1 + Task 2 commits only
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          TASK2_HEAD: ${{ steps.task2.outputs.head }}
        run: |
          set -euo pipefail
          git reset --hard "$TASK2_HEAD"
          git push origin "$TASK2_HEAD":agent/review-bundle-fasttrack-r3

      - name: Record hosted authoring evidence
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TASK1_HEAD: ${{ steps.task1.outputs.head }}
          TASK1_VERSION: ${{ steps.task1.outputs.version }}
          TASK2_HEAD: ${{ steps.task2.outputs.head }}
          TASK2_VERSION: ${{ steps.task2.outputs.version }}
          TESTED_COMMIT: ${{ steps.validated.outputs.tested_commit }}
          TESTED_TREE: ${{ steps.validated.outputs.tested_tree }}
        run: |
          set -euo pipefail
          cat > /tmp/evidence.md <<EOF
          <!-- dish-implementation-evidence:v1 -->
          HOSTED AUTHORING EVIDENCE — ordered workstream 1217594495187308 -> 1217587510908418

          Task 1 commit: \`$TASK1_HEAD\` — \`$TASK1_VERSION\`
          Task 2 commit: \`$TASK2_HEAD\` — \`$TASK2_VERSION\`
          Prospective helper-free validation commit: \`$TESTED_COMMIT\`
          Prospective helper-free tested tree: \`$TESTED_TREE\`

          PASS: Task 1 canonical Project check and focused Review/kernel regressions completed before Task 2 authoring.
          PASS: Task 2 canonical Project check and focused Review/FastTrack/kernel regressions completed before helper-free validation.
          PASS: exact prospective helper-free tree passed canonical Project check, test-plan validation, diff check, and every governed planner-selected command.

          The remote branch is intentionally published at Task 2 first because GitHub Actions may not mutate workflow files. Implementation will delete the two temporary workflow files, four temporary authoring scripts, and bootstrap marker through the GitHub connector, then prove the resulting final Git tree exactly equals \`$TESTED_TREE\` before marking the PR review-ready.

          GATE WAIVED BY MARCO OVERRIDE: exact-current repository-bundle witness/transport gate only. Raw bundle-unavailable evidence remains FAILED.

          — Dish Agent: Implementation | GitHub Actions | PR #169
          EOF
          gh pr comment 169 --repo "$GITHUB_REPOSITORY" --body-file /tmp/evidence.md
