name: Temporary bootstrap Review/FastTrack hosted trigger

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'agent/review-bundle-fasttrack-r3'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Switch hosted implementation helper to PR synchronize
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/tmp-review-bundle-fasttrack-r3.yml')
          text=path.read_text()
          old="""on:\n  push:\n    branches:\n      - agent/review-bundle-fasttrack-r3\n"""
          new="""on:\n  pull_request:\n    branches: [main]\n    types: [synchronize]\n"""
          if text.count(old)!=1:
              raise SystemExit('hosted helper trigger baseline changed')
          text=text.replace(old,new,1)
          old_if="    if: github.event.head_commit.message == 'Add temporary hosted implementation workflow'"
          new_if="    if: github.event.pull_request.head.ref == 'agent/review-bundle-fasttrack-r3'"
          if text.count(old_if)!=1:
              raise SystemExit('hosted helper job condition baseline changed')
          path.write_text(text.replace(old_if,new_if,1))
          PY
          rm .github/workflows/tmp-bootstrap-review-fasttrack-trigger.yml
          git config user.name 'Dish Agent'
          git config user.email 'dish-agent@users.noreply.github.com'
          git add -A
          git commit -m 'Activate PR-triggered hosted implementation'
          git push origin HEAD:agent/review-bundle-fasttrack-r3
