name: Publication materializer

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  filter:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'dish-publication-materialize:v1')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      valid: ${{ steps.filter.outputs.valid }}
      classification: ${{ steps.filter.outputs.classification }}
      route: ${{ steps.filter.outputs.route }}
      pr_number: ${{ steps.filter.outputs.pr_number }}
      request_id: ${{ steps.filter.outputs.request_id }}
      artifact_id: ${{ steps.filter.outputs.artifact_id }}
      artifact_name: ${{ steps.filter.outputs.artifact_name }}
      artifact_digest: ${{ steps.filter.outputs.artifact_digest }}
      artifact_run_id: ${{ steps.filter.outputs.artifact_run_id }}
    steps:
      - name: Resolve exact trusted default-branch source
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.head_sha')"
          test "${#source_sha}" -eq 40
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact trusted request parser
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.authority.outputs.source_sha }}
          persist-credentials: false
      - name: Validate request and select materialize-or-recover route without write authority
        id: filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/publication_materializer.py filter
          --event-path "$GITHUB_EVENT_PATH"
          --run-attempt "${{ github.run_attempt }}"
          --github-output "$GITHUB_OUTPUT"

  materialize:
    needs: filter
    if: needs.filter.outputs.valid == 'true' && needs.filter.outputs.route == 'materialize'
    runs-on: ubuntu-latest
    concurrency:
      group: dish-publication-materialize-${{ needs.filter.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.materialize.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact_run_id: ${{ github.run_id }}
      candidate_commit: ${{ steps.verify.outputs.candidate_commit }}
      tree: ${{ steps.verify.outputs.tree }}
      parent: ${{ steps.verify.outputs.parent }}
      pr_number: ${{ steps.materialize.outputs.pr_number }}
      request_id: ${{ steps.materialize.outputs.request_id }}
    steps:
      - name: Resolve exact trusted default-branch source
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.head_sha')"
          test "${#source_sha}" -eq 40
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact trusted materializer source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.authority.outputs.source_sha }}
          persist-credentials: false
      - name: Revalidate and create unattached exact-tree child commit
        id: materialize
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/publication_materializer.py materialize
          --event-path "$GITHUB_EVENT_PATH"
          --result-path "$RUNNER_TEMP/publication-materializer-result.json"
          --source-sha "${{ steps.authority.outputs.source_sha }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --github-output "$GITHUB_OUTPUT"
      - name: Persist immutable request/run-attempt result before reporting
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.materialize.outputs.artifact_name }}
          path: ${{ runner.temp }}/publication-materializer-result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Fail closed if durable result persistence failed
        if: steps.upload.outcome != 'success'
        run: |
          echo "UNRESOLVED_MATERIALIZED_RESULT: exact candidate exists but durable pre-report result was not persisted" >&2
          exit 2
      - name: Re-read durable result and independently verify exact candidate
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci/publication_materializer.py verify-result-artifact
          --event-path "$GITHUB_EVENT_PATH"
          --artifact-id "${{ steps.upload.outputs.artifact-id }}"
          --artifact-name "${{ steps.materialize.outputs.artifact_name }}"
          --artifact-digest "${{ steps.upload.outputs.artifact-digest }}"
          --artifact-run-id "${{ github.run_id }}"
          --github-output "$GITHUB_OUTPUT"

  report:
    needs: [filter, materialize]
    if: >-
      always() &&
      needs.filter.outputs.valid == 'true' &&
      (needs.filter.outputs.route == 'recover' || needs.materialize.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Resolve exact trusted default-branch recovery source
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.head_sha')"
          test "${#source_sha}" -eq 40
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact trusted recovery/report source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.authority.outputs.source_sha }}
          persist-credentials: false
      - name: Recover durable candidate and publish result idempotently
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.filter.outputs.route == 'recover' && needs.filter.outputs.artifact_id || needs.materialize.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.filter.outputs.route == 'recover' && needs.filter.outputs.artifact_name || needs.materialize.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ needs.filter.outputs.route == 'recover' && needs.filter.outputs.artifact_digest || needs.materialize.outputs.artifact_digest }}
          ARTIFACT_RUN_ID: ${{ needs.filter.outputs.route == 'recover' && needs.filter.outputs.artifact_run_id || needs.materialize.outputs.artifact_run_id }}
        run: >-
          python scripts/ci/publication_materializer.py publish-result
          --event-path "$GITHUB_EVENT_PATH"
          --artifact-id "$ARTIFACT_ID"
          --artifact-name "$ARTIFACT_NAME"
          --artifact-digest "$ARTIFACT_DIGEST"
          --artifact-run-id "$ARTIFACT_RUN_ID"
