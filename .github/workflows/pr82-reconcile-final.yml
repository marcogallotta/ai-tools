name: PR82 canonical reconciliation final
on:
  push:
    branches: [agent/d1-durable-review-routing]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/d1-durable-review-routing
          fetch-depth: 0
      - name: Reconcile, version, render, validate, publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/pr82-merge-diagnose.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(src) if l.strip()=='run: |') + 1
          lines=[]
          for line in src[start:]:
              if line.startswith('          '): lines.append(line[10:])
              elif not line.strip(): lines.append('')
              else: break
          script='\n'.join(lines)+'\n'
          script=script.replace('python3 dish/scripts/chatgpt_project_kernels.py generate','python3 dish/scripts/chatgpt_project_kernels.py render')
          script=script.replace('python3 dish/scripts/chatgpt_project_kernels.py eval-validate\n','')
          versioner=r'''python3 - <<'PYV'
          import hashlib, importlib.util, json, subprocess
          from pathlib import Path
          script_path=Path('dish/scripts/chatgpt_project_kernels.py')
          spec=importlib.util.spec_from_file_location('merged_kernels', script_path)
          k=importlib.util.module_from_spec(spec); spec.loader.exec_module(k)
          project=Path('dish/docs/chatgpt-projects')
          source=json.loads((project/'source.json').read_text())
          main_source=json.loads(subprocess.check_output(['git','show','origin/main:dish/docs/chatgpt-projects/source.json'],text=True))
          manifest=json.loads(subprocess.check_output(['git','show','origin/main:dish/docs/chatgpt-projects/manifest.json'],text=True))
          old_version=manifest['canonical_version']
          old_effect={r:{x['id']:x for x in k.effective_rules(main_source,r)} for r in main_source['roles']}
          new_effect={r:{x['id']:x for x in k.effective_rules(source,r)} for r in source['roles']}
          changed={}
          roles=set(source['roles'])
          for role in sorted(roles):
              old=old_effect.get(role,{})
              new=new_effect[role]
              for rid in sorted(set(old)|set(new)):
                  if old.get(rid)==new.get(rid): continue
                  x=new.get(rid) or old.get(rid)
                  key=(rid,x['impact'],x['surface'],tuple(x['action_boundaries']))
                  changed.setdefault(key,[]).append(role)
          changes=[]
          for (rid,impact,surface,bounds),rs in sorted(changed.items()):
              changes.append({'rule_id':rid,'roles':rs,'impact':impact,'action_boundaries':list(bounds),'surface':surface})
          if not changes: raise SystemExit('merged source produced no canonical rule changes')
          def fp(x):
              payload={q:x.get(q) for q in ('id','text','impact','surface','action_boundaries')}
              return hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          prior_shared={x['id']:fp(x) for x in k._rules(main_source.get('shared_rules'),'shared_rules')}
          prior_roles={}
          for role in main_source['roles']:
              prior_roles[role]={x['id']:fp(x) for x in k._rules(main_source['roles'][role].get('rules'),f'roles.{role}.rules')}
          kid=k.kernel_identity(source)
          new_version=f"{manifest['version_namespace']}-{kid[:12]}"
          manifest['canonical_version']=new_version
          manifest['kernel_identity_sha256']=kid
          manifest['source_sha256']=hashlib.sha256(json.dumps(source,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          manifest['generated_role_files']={r:f'{r}.md' for r in source['roles']}
          edge={'from_version':old_version,'to_version':new_version,'changes':changes,'from_rule_fingerprints':{'_shared':prior_shared,'_roles':prior_roles},'from_renderer_fingerprint':k.renderer_fingerprint()}
          manifest['change_history'].append(edge)
          (project/'manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print('canonical_version',new_version,'changes',len(changes))
          PYV
          '''
          script=script.replace('python3 dish/scripts/chatgpt_project_kernels.py render\n',versioner+'python3 dish/scripts/chatgpt_project_kernels.py render\n',1)
          script=script.replace("git rm .github/workflows/pr82-merge-diagnose.yml\n","git rm .github/workflows/pr82-merge-diagnose.yml .github/workflows/pr82-reconcile-retry.yml .github/workflows/pr82-reconcile-final.yml\n")
          Path('/tmp/pr82-final.sh').write_text(script)
          PY
          bash /tmp/pr82-final.sh
