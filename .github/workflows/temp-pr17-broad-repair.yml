name: Temporary PR17 Broad repair

on:
  push:
    branches: [agent/exact-head-pr-ci-gate]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Stage PR17 Broad repair'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/exact-head-pr-ci-gate
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - uses: ./.github/actions/setup-python-bundle
        with:
          github-token: ${{ github.token }}

      - name: Apply bounded Broad-suite governance repairs
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/mock.patch
          git apply /tmp/mock.patch
          cat > dish/tests/postgresql/conftest.py <<'PY'
          """Shared PostgreSQL test fixtures."""

          from tests.support.postgresql.workflow import workflow_db

          __all__ = ["workflow_db"]
          PY
          dish/.venv/bin/python dish/scripts/dish-pg-stage-a-baseline --write \
            --reason "Refresh governed source hashes after reviewed admin CLI prompt change"

      - name: Requalify the drifted parallel-safe command tests
        shell: bash
        run: |
          set -euo pipefail
          cd dish
          PY=.venv/bin/python
          Q=scripts/dish-parallel-safe-qualify
          COMMON=(--test-file tests/test_commands.py --reviewer 'Dish Agent: Implementation | ChatGPT')
          "$PY" "$Q" "${COMMON[@]}" --phase serial --restart --note 'Requalify after shared helper drift exposed by ordinary CI'
          "$PY" "$Q" "${COMMON[@]}" --phase 2
          "$PY" "$Q" "${COMMON[@]}" --phase 4
          "$PY" "$Q" "${COMMON[@]}" --phase 8
          "$PY" "$Q" "${COMMON[@]}" --phase finalize

      - name: Verify the previously failing Broad Python contracts
        shell: bash
        run: |
          set -euo pipefail
          dish/.venv/bin/python -m pytest -q \
            dish/tests/test_test_mock_boundary_contract.py \
            dish/tests/test_dish_test_lane.py::test_parallel_safe_workers_use_invoking_environment_and_exact_selection \
            dish/tests/postgresql/test_dark_launch_evidence.py::test_capture_only_create_cascade_gets_distinct_gap_classification \
            dish/tests/postgresql/test_stage1_baseline_contract.py::test_frozen_governing_sources_have_exact_hashes \
            dish/tests/postgresql/test_stage1_baseline_contract.py::test_canonical_stage_a_regeneration_matches_checked_in_bytes
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'dish/docs/database-backend-stage-a-baseline.json',
              'dish/test_selection/parallel_safe_qualifications.json',
              'dish/tests/postgresql/conftest.py',
              'dish/tests/test_test_mock_boundary_contract.py',
          }
          rows = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          actual = {row[3:] for row in rows}
          if actual != expected:
              raise SystemExit(f'unexpected repair surface: {sorted(actual)} != {sorted(expected)}')
          print('repair surface verified:', ', '.join(sorted(actual)))
          PY

      - name: Commit repairs and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-pr17-broad-repair.yml
          git add \
            dish/docs/database-backend-stage-a-baseline.json \
            dish/test_selection/parallel_safe_qualifications.json \
            dish/tests/postgresql/conftest.py \
            dish/tests/test_test_mock_boundary_contract.py
          git config user.name 'Dish Agent Implementation'
          git config user.email 'noreply@github.com'
          git commit -m 'Clear latent Broad Python CI blockers'
          git push origin HEAD:agent/exact-head-pr-ci-gate
