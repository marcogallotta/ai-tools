name: Repository bundle publication

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: repository-bundle-publication-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-verify-artifact:
    name: Build and verify exact-main repository bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}
      release_tag: ${{ steps.bundle.outputs.release_tag }}
      bundle_name: ${{ steps.bundle.outputs.bundle_name }}
      manifest_name: ${{ steps.bundle.outputs.manifest_name }}
      checksum_name: ${{ steps.bundle.outputs.checksum_name }}
    env:
      SOURCE_REF: refs/heads/main
      REPOSITORY_ID: ${{ github.repository_id }}
    steps:
      - name: Mark repository bundle publication pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='Dish / repository bundle' \
            -f description='Publishing exact repository bundle' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize exact advertised main ref
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          if [[ "$GITHUB_REF" != "$SOURCE_REF" ]]; then
            echo "workflow event ref mismatch: expected $SOURCE_REF, got $GITHUB_REF" >&2
            exit 1
          fi
          # The immutable publication is bound to this workflow event's exact main SHA.
          # A later main push must not invalidate this already-started publication.
          git fetch --force origin "$SOURCE_REF"
          git cat-file -e "$source_sha^{commit}"
          git update-ref "$SOURCE_REF" "$source_sha"
          printf 'SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Build event-bound repository bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/repository-bundle-publication
          mkdir -p .ci/repository-bundle-publication
          python3 scripts/repository_bundle.py build \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir .ci/repository-bundle-publication \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$REPOSITORY_ID" \
            --source-sha "$SOURCE_SHA" \
            --source-ref "$SOURCE_REF" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-ref "$GITHUB_REF" \
            --event-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify checksum, bundle, advertised main, and clone
        shell: bash
        env:
          BUNDLE_NAME: ${{ steps.bundle.outputs.bundle_name }}
          MANIFEST_NAME: ${{ steps.bundle.outputs.manifest_name }}
          CHECKSUM_NAME: ${{ steps.bundle.outputs.checksum_name }}
        run: |
          set -euo pipefail
          rm -rf .ci/repository-bundle-clone
          python3 scripts/repository_bundle.py verify \
            --bundle ".ci/repository-bundle-publication/$BUNDLE_NAME" \
            --manifest ".ci/repository-bundle-publication/$MANIFEST_NAME" \
            --checksum ".ci/repository-bundle-publication/$CHECKSUM_NAME" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-repository-id "$REPOSITORY_ID" \
            --expected-sha "$SOURCE_SHA" \
            --expected-ref "$SOURCE_REF" \
            --clone-dir .ci/repository-bundle-clone
          test "$(git -C .ci/repository-bundle-clone rev-parse HEAD)" = "$SOURCE_SHA"
          git -C .ci/repository-bundle-clone log --oneline -3
          git -C .ci/repository-bundle-clone grep -n "dependency-bundle" -- CLAUDE.md

      - name: Upload ChatGPT Actions artifact mirror
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: .ci/repository-bundle-publication
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish immutable Release authority
    if: github.ref == 'refs/heads/main'
    needs: build-verify-artifact
    permissions:
      actions: read
      contents: write
    concurrency:
      group: repository-bundle-release-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ needs.build-verify-artifact.outputs.source_sha }}
      ARTIFACT_NAME: ${{ needs.build-verify-artifact.outputs.artifact_name }}
      RELEASE_TAG: ${{ needs.build-verify-artifact.outputs.release_tag }}
      BUNDLE_NAME: ${{ needs.build-verify-artifact.outputs.bundle_name }}
      MANIFEST_NAME: ${{ needs.build-verify-artifact.outputs.manifest_name }}
      CHECKSUM_NAME: ${{ needs.build-verify-artifact.outputs.checksum_name }}
    steps:
      - name: Download verified Actions artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .ci/repository-bundle-publication
          mkdir -p .ci/repository-bundle-publication
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir .ci/repository-bundle-publication

      - name: Publish immutable Release authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publication=.ci/repository-bundle-publication
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            rm -rf .ci/repository-bundle-existing
            mkdir -p .ci/repository-bundle-existing
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir .ci/repository-bundle-existing \
              --pattern "$BUNDLE_NAME" \
              --pattern "$MANIFEST_NAME" \
              --pattern "$CHECKSUM_NAME"
            cmp "$publication/$BUNDLE_NAME" ".ci/repository-bundle-existing/$BUNDLE_NAME"
            cmp "$publication/$MANIFEST_NAME" ".ci/repository-bundle-existing/$MANIFEST_NAME"
            cmp "$publication/$CHECKSUM_NAME" ".ci/repository-bundle-existing/$CHECKSUM_NAME"
            echo "Immutable Release already exists with identical assets: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "$RELEASE_TAG" \
              --notes "Exact-main repository bootstrap/cache for ChatGPT agents. GitHub remains source/history authority." \
              "$publication/$BUNDLE_NAME" \
              "$publication/$MANIFEST_NAME" \
              "$publication/$CHECKSUM_NAME"
          fi

  prune-old-releases:
    name: Prune old repository-bundle Releases (maintenance)
    if: github.ref == 'refs/heads/main'
    needs: publish-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prune old Releases without touching current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          protected_tag="repository-bundle-$current_main_sha"
          releases=.ci/repository-bundle-releases.tsv
          mkdir -p .ci
          : > "$releases"
          page=1
          while :; do
            page_json="$(gh api --method GET \
              "/repos/$GITHUB_REPOSITORY/releases" \
              -f per_page=100 \
              -f page="$page")"
            count="$(jq 'length' <<<"$page_json")"
            jq -r '.[] | select(.tag_name | startswith("repository-bundle-")) | [.created_at, .tag_name] | @tsv' \
              <<<"$page_json" >> "$releases"
            if (( count < 100 )); then
              break
            fi
            page=$((page + 1))
          done
          sort -r "$releases" | tail -n +13 | cut -f2- > .ci/repository-bundle-prune.txt
          while IFS= read -r tag; do
            test -n "$tag" || continue
            if [[ "$tag" == "$protected_tag" ]]; then
              echo "Refusing to prune current-main Release: $tag" >&2
              continue
            fi
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < .ci/repository-bundle-prune.txt

  publish-final-status:
    name: Publish exact-run repository bundle status
    if: always()
    needs:
      - build-verify-artifact
      - publish-release
    permissions:
      statuses: write
    runs-on: ubuntu-24.04
    env:
      BUILD_RESULT: ${{ needs.build-verify-artifact.result }}
      RELEASE_RESULT: ${{ needs.publish-release.result }}
    steps:
      - name: Publish final repository bundle status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=failure
          description='Repository bundle publication failed'
          if [[ "$BUILD_RESULT" == success && "$RELEASE_RESULT" == success ]]; then
            state=success
            description='Exact repository bundle published'
          fi
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='Dish / repository bundle' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
