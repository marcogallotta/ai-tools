name: Full regression
run-name: Full regression / ${{ github.sha }} / ${{ github.event_name }}

on:
  schedule:
    # Deliberately off the top of the hour; scheduled workflows run latest default-branch code.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: Why Coordinator requested an additional full run
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dish-full-regression-main
  cancel-in-progress: false

jobs:
  full-regression:
    name: Full-system diagnostic regression
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FULL_REGRESSION_OUTPUT: .test-artifacts/full-regression
      DISH_TEST_POSTGRESQL_DSN: postgresql+psycopg://ai_tools_ci:ci-only-password@127.0.0.1:5432/dish_ai_tools_ci_test
    steps:
      - name: Mark workflow start
        shell: bash
        run: |
          set -euo pipefail
          printf 'FULL_REGRESSION_STARTED_EPOCH=%s\n' "$(date +%s)" >> "$GITHUB_ENV"

      - name: Require exact main execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo "Full regression must run against refs/heads/main, got $GITHUB_REF" >&2
            exit 2
          }
          test "${#GITHUB_SHA}" -eq 40

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Discover prior completed full-regression runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$FULL_REGRESSION_OUTPUT/discovery"
          gh api \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/full-regression.yml/runs?branch=main&status=completed&per_page=100" \
            > "$FULL_REGRESSION_OUTPUT/discovery/runs.json"

      - name: Skip unchanged scheduled main after a successful equivalent result
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/full_regression.py decide \
            --runs-json "$FULL_REGRESSION_OUTPUT/discovery/runs.json" \
            --main-sha "$GITHUB_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --current-run-id "$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Report unchanged-main dedupe
        if: steps.decision.outputs.should_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Skipping heavy full regression: unchanged main $GITHUB_SHA already has completed successful run ${{ steps.decision.outputs.equivalent_success_run_id }}."
          {
            echo '## Full regression deduplicated'
            echo
            echo "Main SHA: \`$GITHUB_SHA\`"
            echo "Equivalent completed run: \`${{ steps.decision.outputs.equivalent_success_run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Begin durable full-regression evidence
        if: steps.decision.outputs.should_run == 'true'
        shell: bash
        env:
          MANUAL_REASON: ${{ github.event.inputs.reason || '' }}
        run: |
          set -euo pipefail
          python3 scripts/full_regression.py begin \
            --output-dir "$FULL_REGRESSION_OUTPUT" \
            --main-sha "$GITHUB_SHA" \
            --previous-main-sha "${{ steps.decision.outputs.previous_main_sha }}" \
            --previous-run-id "${{ steps.decision.outputs.previous_run_id }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --reason "$MANUAL_REASON" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --started-at-epoch "$FULL_REGRESSION_STARTED_EPOCH"

      - name: Read dependency bundle Python version
        id: bundle
        if: steps.decision.outputs.should_run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dependency_bundle.py expected \
            --repo-root "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        id: setup-python
        if: steps.decision.outputs.should_run == 'true'
        continue-on-error: true
        with:
          python-version: ${{ steps.bundle.outputs.python_version || '3.12' }}

      - name: Record Python setup result
        if: always() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 scripts/full_regression.py record-phase \
            --output-dir "$FULL_REGRESSION_OUTPUT" \
            --phase setup-python \
            --outcome '${{ steps.setup-python.outcome }}'

      - uses: ./.github/actions/setup-python-bundle
        id: setup-bundle
        if: steps.decision.outputs.should_run == 'true'
        continue-on-error: true
        with:
          github-token: ${{ github.token }}

      - name: Record dependency bundle setup result
        if: always() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 scripts/full_regression.py record-phase \
            --output-dir "$FULL_REGRESSION_OUTPUT" \
            --phase dependency-bundle \
            --outcome '${{ steps.setup-bundle.outcome }}'

      - uses: actions/setup-node@v6
        id: setup-node
        if: steps.decision.outputs.should_run == 'true'
        continue-on-error: true
        with:
          node-version: '22'

      - name: Record Node setup result
        if: always() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 scripts/full_regression.py record-phase \
            --output-dir "$FULL_REGRESSION_OUTPUT" \
            --phase setup-node \
            --outcome '${{ steps.setup-node.outcome }}'

      - name: Install PGlite Node dependencies
        if: always() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 scripts/full_regression.py run-phase \
            --output-dir "$FULL_REGRESSION_OUTPUT" \
            --phase pglite-node-dependencies -- \
            bash -lc '
              set -euo pipefail
              cd dish/tests/postgresql/pglite
              npm ci --no-audit --no-fund
            '

      # Adapter seam: the command following `--` can be replaced by Agent C's shared lane runner.
      # This workflow owns force-all/continue/evidence semantics, not final lane command semantics.
      - name: Run Python/control-plane group
        if: always() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 scripts/full_regression.py run-lane \
            --output-dir "$FULL_REGRESSION_OUTPUT" \
            --lane python-control-plane -- \
            bash -lc '
              set +e
              mkdir -p .test-artifacts/full-regression/junit
              rc=0

              ci_rc=0
              dish/.venv/bin/python -m pytest -q ci/tests \
                --junitxml=.test-artifacts/full-regression/junit/ci.xml || ci_rc=$?
              python3 scripts/full_regression.py collect-junit \
                --output-dir "$FULL_REGRESSION_OUTPUT" --lane python-control-plane \
                --source ci-tests --junit .test-artifacts/full-regression/junit/ci.xml \
                --command-exit "$ci_rc"
              [ "$ci_rc" -eq 0 ] || rc=1

              plan_rc=0
              (cd dish && .venv/bin/python scripts/dish-test-plan --validate) || plan_rc=$?
              if [ "$plan_rc" -ne 0 ]; then
                python3 scripts/full_regression.py record-failure \
                  --output-dir "$FULL_REGRESSION_OUTPUT" --lane python-control-plane \
                  --source dish-test-plan --invariant "governed test-plan validation" \
                  --failure-kind command_failed --detail "command exited with status $plan_rc"
                rc=1
              fi

              dish_rc=0
              (cd dish && .venv/bin/python -m pytest -q tests \
                --junitxml=../.test-artifacts/full-regression/junit/dish.xml) || dish_rc=$?
              python3 scripts/full_regression.py collect-junit \
                --output-dir "$FULL_REGRESSION_OUTPUT" --lane python-control-plane \
                --source dish-tests --junit .test-artifacts/full-regression/junit/dish.xml \
                --command-exit "$dish_rc"
              [ "$dish_rc" -eq 0 ] || rc=1

              tools_rc=0
              tools/.venv/bin/python -m pytest -q tools/tests \
                --junitxml=.test-artifacts/full-regression/junit/tools.xml || tools_rc=$?
              python3 scripts/full_regression.py collect-junit \
                --output-dir "$FULL_REGRESSION_OUTPUT" --lane python-control-plane \
                --source tools-tests --junit .test-artifacts/full-regression/junit/tools.xml \
                --command-exit "$tools_rc"
              [ "$tools_rc" -eq 0 ] || rc=1
              exit "$rc"
            '

      - name: Run frontend static/tooling group
        if: always() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 scripts/full_regression.py run-lane \
            --output-dir "$FULL_REGRESSION_OUTPUT" \
            --lane frontend-static-tooling -- \
            bash -lc '
              set +e
              mkdir -p .test-artifacts/full-regression/junit
              rc=0
              run_named() {
                source="$1"
                invariant="$2"
                shift 2
                "$@"
                command_rc=$?
                if [ "$command_rc" -ne 0 ]; then
                  python3 scripts/full_regression.py record-failure \
                    --output-dir "$FULL_REGRESSION_OUTPUT" --lane frontend-static-tooling \
                    --source "$source" --invariant "$invariant" \
                    --failure-kind command_failed --detail "command exited with status $command_rc"
                  rc=1
                fi
              }
              run_named format-check "frontend formatting contract" npm --prefix dish/frontend run format:check
              run_named lint "frontend lint contract" npm --prefix dish/frontend run lint
              run_named openapi-check "frontend OpenAPI contract" bash -lc "cd dish/frontend && node tools/check-openapi.mjs"
              run_named generated-client-check "generated frontend client is current" bash -lc "cd dish/frontend && node tools/generate-client.mjs --check"

              unit_rc=0
              (cd dish/frontend && node --test --test-reporter=junit \
                --test-reporter-destination=../../.test-artifacts/full-regression/junit/frontend-unit.xml \
                tests/unit/*.test.mjs) || unit_rc=$?
              python3 scripts/full_regression.py collect-junit \
                --output-dir "$FULL_REGRESSION_OUTPUT" --lane frontend-static-tooling \
                --source frontend-unit --junit .test-artifacts/full-regression/junit/frontend-unit.xml \
                --command-exit "$unit_rc"
              [ "$unit_rc" -eq 0 ] || rc=1
              run_named frontend-build "frontend production build" npm --prefix dish/frontend run build
              exit "$rc"
            '

      - name: Start isolated PostgreSQL for native group
        if: always() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 scripts/full_regression.py run-phase \
            --output-dir "$FULL_REGRESSION_OUTPUT" \
            --phase native-postgresql-setup -- \
            bash -lc '
              set -euo pipefail
              docker rm -f dish-full-regression-postgres >/dev/null 2>&1 || true
              docker run -d --rm \
                --name dish-full-regression-postgres \
                -e POSTGRES_DB=dish_ai_tools_ci_test \
                -e POSTGRES_USER=ai_tools_ci \
                -e POSTGRES_PASSWORD=ci-only-password \
                -p 5432:5432 postgres:17.10 >/dev/null
              for _ in $(seq 1 60); do
                if docker exec dish-full-regression-postgres \
                  pg_isready -U ai_tools_ci -d dish_ai_tools_ci_test >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 1
              done
              echo "PostgreSQL did not become ready" >&2
              exit 1
            '

      - name: Run native PostgreSQL group
        if: always() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 scripts/full_regression.py run-lane \
            --output-dir "$FULL_REGRESSION_OUTPUT" \
            --lane native-postgresql -- \
            bash -lc '
              set +e
              report=.test-artifacts/full-regression/native-postgresql-report.json
              waiver_args_file=.test-artifacts/full-regression/native-postgresql-waiver-args.txt
              waiver_rc=0
              python3 scripts/native_postgresql_waivers.py args > "$waiver_args_file" || waiver_rc=$?
              if [ "$waiver_rc" -ne 0 ]; then
                echo "Native PostgreSQL waiver registry serialization failed with status $waiver_rc" >&2
                exit "$waiver_rc"
              fi
              mapfile -t native_waiver_args < "$waiver_args_file"
              dish/.venv/bin/python dish/scripts/dish-pg-native-certification \
                --output "$report" \
                "${native_waiver_args[@]}"
              native_rc=$?
              python3 scripts/full_regression.py collect-native-report \
                --output-dir "$FULL_REGRESSION_OUTPUT" --lane native-postgresql \
                --source native-certification --report "$report" --command-exit "$native_rc"
              exit "$native_rc"
            '

      - name: Stop isolated PostgreSQL
        if: always() && steps.decision.outputs.should_run == 'true'
        continue-on-error: true
        shell: bash
        run: docker rm -f dish-full-regression-postgres >/dev/null 2>&1 || true

      - name: Install maintained Chromium runtime
        if: always() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 scripts/full_regression.py run-phase \
            --output-dir "$FULL_REGRESSION_OUTPUT" \
            --phase chromium-setup -- \
            dish/.venv/bin/python -m playwright install --with-deps chromium

      - name: Run browser acceptance group
        if: always() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 scripts/full_regression.py run-lane \
            --output-dir "$FULL_REGRESSION_OUTPUT" \
            --lane browser-acceptance -- \
            bash -lc '
              set +e
              mkdir -p .test-artifacts/full-regression/junit
              rc=0

              browser_rc=0
              npm --prefix dish/frontend run test:browser || browser_rc=$?
              if [ "$browser_rc" -ne 0 ]; then
                python3 scripts/full_regression.py record-failure \
                  --output-dir "$FULL_REGRESSION_OUTPUT" --lane browser-acceptance \
                  --source browser-harness --invariant "frontend browser harness" \
                  --failure-kind command_failed --detail "command exited with status $browser_rc"
                rc=1
              fi

              build_rc=0
              npm --prefix dish/frontend run build || build_rc=$?
              if [ "$build_rc" -ne 0 ]; then
                python3 scripts/full_regression.py record-failure \
                  --output-dir "$FULL_REGRESSION_OUTPUT" --lane browser-acceptance \
                  --source acceptance-build --invariant "browser acceptance build" \
                  --failure-kind command_failed --detail "command exited with status $build_rc"
                rc=1
              fi

              acceptance_rc=0
              (cd dish/frontend && ../.venv/bin/python -m pytest -q tests/browser \
                --junitxml=../../.test-artifacts/full-regression/junit/browser-acceptance.xml) || acceptance_rc=$?
              python3 scripts/full_regression.py collect-junit \
                --output-dir "$FULL_REGRESSION_OUTPUT" --lane browser-acceptance \
                --source browser-acceptance-pytest \
                --junit .test-artifacts/full-regression/junit/browser-acceptance.xml \
                --command-exit "$acceptance_rc"
              [ "$acceptance_rc" -eq 0 ] || rc=1
              exit "$rc"
            '

      - name: Finalize full-regression evidence
        if: always() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/full_regression.py finalize \
            --output-dir "$FULL_REGRESSION_OUTPUT" \
            --evidence "$FULL_REGRESSION_OUTPUT/evidence.json"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          payload = json.loads(Path('.test-artifacts/full-regression/evidence.json').read_text())
          print('## Full regression')
          print()
          print(f"Main SHA: `{payload['main_sha']}`")
          print(f"Range: `{payload['commit_range'] or 'initial full-regression baseline'}`")
          print(f"Result: **{payload['overall_result']}**")
          print(f"Approximate billed minutes: {payload['estimated_billed_minutes']}")
          if payload['failures']:
              print()
              print('Failures requiring durable triage:')
              for failure in payload['failures']:
                  print(
                      f"- `{failure['failure_id']}` [{failure['component']}] "
                      f"{failure['invariant']} ({failure['failure_kind']})"
                  )
          PY

      - name: Upload durable full-regression evidence
        if: always() && steps.decision.outputs.should_run == 'true'
        uses: ./.github/actions/upload-test-evidence
        with:
          name: full-regression-${{ github.sha }}
          path: |
            .test-artifacts/full-regression
            dish/.test-artifacts
            dish/frontend/screenshots

      - name: Enforce terminal full-regression result after evidence upload
        if: always() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 scripts/full_regression.py enforce \
            --evidence "$FULL_REGRESSION_OUTPUT/evidence.json"
