name: Temporary Task 2 push kick

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  kick:
    if: github.event.pull_request.head.ref == 'agent/stable-authoring-base'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Emit one observable branch push and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-task2-push-kick.yml
          git config user.name 'Dish Agent'
          git config user.email 'dish-agent@users.noreply.github.com'
          git add -A
          git commit -m 'Trigger Task 2 branch authoring'
          git push origin HEAD:agent/stable-authoring-base
