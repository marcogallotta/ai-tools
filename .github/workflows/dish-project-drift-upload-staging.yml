name: Temporary Project drift materializer

on:
  push:
    branches:
      - agent/project-drift-upload-staging-1217510062693090

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'Run Project drift upload materializer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          mapping = {
              ".dish-upload/source.json.gz.b64": "dish/docs/chatgpt-projects/source.json",
              ".dish-upload/manifest.json.gz.b64": "dish/docs/chatgpt-projects/manifest.json",
              ".dish-upload/evals.json.gz.b64": "dish/docs/chatgpt-projects/evals.json",
              ".dish-upload/chatgpt_project_kernels.py.gz.b64": "dish/scripts/chatgpt_project_kernels.py",
              ".dish-upload/test_chatgpt_project_kernels.py.gz.b64": "dish/tests/test_chatgpt_project_kernels.py",
          }
          for src, dst in mapping.items():
              data = gzip.decompress(base64.b64decode(Path(src).read_text().strip()))
              Path(dst).parent.mkdir(parents=True, exist_ok=True)
              Path(dst).write_bytes(data)
          PY
          test "$(git hash-object dish/docs/chatgpt-projects/source.json)" = a286fed710af4efbbaec67fc8659957b1de75976
          test "$(git hash-object dish/docs/chatgpt-projects/manifest.json)" = f91090f4f9171030423fda792e97c109c58d3f08
          test "$(git hash-object dish/docs/chatgpt-projects/evals.json)" = 6bab401b1d76a516b94c061124d5702d21cd5e35
          test "$(git hash-object dish/scripts/chatgpt_project_kernels.py)" = 5a1cbae8353233cb6cf249888f6a08bfa46406c6
          test "$(git hash-object dish/tests/test_chatgpt_project_kernels.py)" = 69c590c53270f6940f016e30c4d26b0bf7ffa62a
          rm -rf .dish-upload
          rm -f .github/workflows/dish-project-drift-upload-staging.yml
          git config user.name "Dish Agent Implementation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Project drift compatibility upload"
          git push origin "HEAD:${GITHUB_REF_NAME}"
