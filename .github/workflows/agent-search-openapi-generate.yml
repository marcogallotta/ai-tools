name: Agent Search OpenAPI generation

on:
  push:
    branches:
      - agent/dish-search-surfaces

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dish/requirements-test.txt
      - name: Install Dish test dependencies
        run: python -m pip install -r dish/requirements-test.txt
      - name: Regenerate PostgreSQL Action OpenAPI and run focused contract checks
        working-directory: dish
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from dish_pg.openapi import postgres_action_openapi

          target = Path('openapi/dish-postgresql-action.openapi.json')
          target.write_text(
              json.dumps(postgres_action_openapi(), indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          python -m py_compile dish_pg/command_contract.py dish_pg/postgres_service.py dish_service/cli.py dish_service/http.py
          pytest -q tests/postgresql/test_postgresql_action_openapi_oracle.py
      - name: Commit generated schema
        run: |
          if git diff --quiet -- dish/openapi/dish-postgresql-action.openapi.json; then
            exit 0
          fi
          git config user.name 'Dish Agent: Implementation | ChatGPT'
          git config user.email 'marco+github@gallotta.co.za'
          git add dish/openapi/dish-postgresql-action.openapi.json
          git commit -m 'Regenerate PostgreSQL Action OpenAPI'
          git push origin HEAD:agent/dish-search-surfaces
