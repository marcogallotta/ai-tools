name: Temporary PR17 map classification

on:
  push:
    branches: [agent/exact-head-pr-ci-gate]

permissions:
  contents: write

jobs:
  classify:
    if: github.event.head_commit.message == 'Stage PR17 map classification'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/exact-head-pr-ci-gate
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - uses: ./.github/actions/setup-python-bundle
        with:
          github-token: ${{ github.token }}
      - name: Classify shared PostgreSQL fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('dish/test_selection/ownership.csv')
          text = path.read_text(encoding='utf-8')
          row = 'tests/postgresql/conftest.py,shared-test-infrastructure,1,4,isolated-test; native-pg; postgresql-test-support; shared-test-infrastructure,tests/postgresql/test_dark_launch_evidence.py,,lane-local,exact changed test/module; native PostgreSQL certification,exact changed test/module; native PostgreSQL certification,Run all PostgreSQL consumer lanes affected by shared fixture changes and the ordinary full suite before handoff.,PostgreSQL fixture or collection behavior changes\n'
          needle = 'tests/postgresql/native/test_cutover_activation_checkpoint_rehearsal.py,'
          if row not in text:
              if needle not in text:
                  raise SystemExit('expected insertion anchor missing')
              text = text.replace(needle, row + needle, 1)
              path.write_text(text, encoding='utf-8')
          PY
          cd dish
          .venv/bin/python scripts/dish-test-plan --validate
          .venv/bin/python -m pytest -q \
            tests/test_dish_test_map_validation.py \
            tests/postgresql/test_dark_launch_evidence.py::test_capture_only_create_cascade_gets_distinct_gap_classification
          .venv/bin/python scripts/dish-test-plan --path tests/postgresql/conftest.py
          cd ..
          git diff --check
      - name: Commit classification and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-pr17-map-classification.yml
          git add dish/test_selection/ownership.csv
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/temp-pr17-map-classification.yml\ndish/test_selection/ownership.csv'
          git config user.name 'Dish Agent Implementation'
          git config user.email 'noreply@github.com'
          git commit -m 'Classify shared PostgreSQL test fixture'
          git push origin HEAD:agent/exact-head-pr-ci-gate
